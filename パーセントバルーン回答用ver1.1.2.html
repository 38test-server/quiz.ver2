<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーセントバルーン風 クイズ回答ブラウザ ver1.1.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e24a4a;
            --default-bg: lightskyblue;
            --ui-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--default-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 画面共通のホワイトパネルスタイル */
        .panel {
            background: var(--ui-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1, h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* --- 設定画面 --- */
        #setup-screen .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        #setup-screen label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        #setup-screen input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .bg-options {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .bg-thumb-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            background: #fff;
        }
        .bg-option-label {
            position: relative;
            cursor: pointer;
        }
        .bg-option-label input {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 1;
        }
        .setup-bg-thumb {
            width: 100px;
            height: 56.25px; /* 16:9 */
            object-fit: cover;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .bg-option-label input:checked + .setup-bg-thumb {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        /* --- ゲーム画面 --- */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 上部問題エリア */
        .question-box {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: var(--ui-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        #q-number {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #q-text {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }

        /* 中央イメージ画像 */
        .image-container {
            position: absolute;
            top: 160px;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #q-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.5);
        }

        /* 下部中央：パーセントゲージ */
        .gauge-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            height: 45px;
            background-color: #5c3a21; /* 下地：茶色 */
            border: 4px solid #3d2514;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .gauge-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to bottom, #ffe066 0%, #f5b041 100%); 
        }
        .gauge-center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0,0,0,0.2);
            border-left: 1px dashed rgba(255,255,255,0.4);
        }
        .user-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            display: none;
            transform: translateX(-50%);
            z-index: 5;
        }
        .correct-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            display: none;
            transform: translateX(-50%);
            z-index: 4;
        }
        .gauge-labels {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            font-size: 14px;
            padding: 0 10px;
        }

        /* 左下：入力欄エリア */
        .input-area {
            position: fixed;
            left: 40px;
            bottom: 25px;
            background: var(--ui-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        .input-area input {
            width: 80px;
            font-size: 22px;
            padding: 6px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-weight: bold;
        }
        .input-area span {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        /* 右下：風船カウンターエリア */
        .balloon-counter {
            position: fixed;
            right: 45px;
            bottom: 35px;
            width: 110px;
            height: 135px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #ff6b8b;
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.4);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(150,40,70,0.4);
            z-index: 10;
            animation: float 3s ease-in-out infinite alternate;
        }
        .balloon-counter::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #ff6b8b;
        }
        .balloon-label {
            font-size: 13px;
            letter-spacing: 1px;
        }
        #balloon-val {
            font-size: 42px;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* 中央メッセージ表示 */
        #result-message {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        /* --- 結果画面 --- */
        #result-screen {
            display: none;
        }
        #result-title {
            font-size: 36px;
            margin-bottom: 15px;
        }
        #result-desc {
            font-size: 18px;
            margin-bottom: 30px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="setup-screen" class="panel">
        <h1>🎈 パーセントバルーン クイズ</h1>
        <hr style="margin-bottom:20px; border:0; border-top:1px solid #eee;">

        <div class="form-group">
            <label>1. 問題データのインポート (JSON)</label>
            <input type="file" id="json-file-input" accept=".json" onchange="loadJsonFile(this)">
            <p id="load-status" style="font-size:13px; color:#666; margin:5px 0 0 0;">
                ※クラウド(Supabase)から自動取得中...
            </p>
        </div>

        <div class="form-group">
            <label for="question-count-input">2. 挑戦する問題数 (登録済: <span id="max-q-count">0</span>問)</label>
            <input type="number" id="question-count-input" min="1" value="5">
        </div>

        <div class="form-group">
            <label>3. 背景画像の設定</label>
            <div class="bg-options">
                <label><input type="radio" name="bg-mode" value="random" checked onchange="toggleBgSelect()"> 全体背景からランダム</label>
                <label><input type="radio" name="bg-mode" value="fixed" onchange="toggleBgSelect()"> 任意の1枚に固定</label>
            </div>
            <div id="bg-select-container" class="bg-thumb-container" style="display:none;">
            </div>
        </div>

        <button id="start-btn" class="btn" style="width:100%; margin-top:10px;" onclick="startGame()" disabled>クイズスタート！</button>
    </div>

    <div id="game-screen">
        <div class="question-box">
            <div id="q-number">第 1 問 / 全 5 問</div>
            <h2 id="q-text">問題文がここに表示されます</h2>
        </div>

        <div class="image-container">
            <img id="q-image" src="" alt="問題画像" style="display:none;">
        </div>

        <div id="result-message"></div>

        <div class="gauge-labels">
            <span>0%</span>
            <span>50%</span>
            <span>100%</span>
        </div>

        <div class="gauge-container">
            <div class="gauge-center-line"></div>
            <div id="user-line" class="user-line"></div>
            <div id="correct-line" class="correct-line"></div>
            <div id="gauge-bar" class="gauge-bar"></div>
        </div>

        <div class="input-area">
            <input type="number" id="user-input" min="0" max="100" placeholder="0">
            <span>%</span>
            <button id="submit-btn" class="btn" onclick="submitAnswer()">決定</button>
            <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">次の問題へ</button>
        </div>

        <div class="balloon-counter">
            <span class="balloon-label">残りの風船</span>
            <span id="balloon-val">100</span>
        </div>
    </div>

    <div id="result-screen" class="panel">
        <h1 id="result-title">GAME CLEAR!!</h1>
        <p id="result-desc"></p>
        <button class="btn" onclick="location.reload()">もう一度遊ぶ</button>
    </div>

<script>
    // Supabaseの設定
    const SUPABASE_URL = "https://aenngzvhrycwwvfflyvw.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlbm5nenZocnljd3d2ZmZseXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEzNTg2MjgsImV4cCI6MjA1NjkzNDYyOH0.sJ6vW13u396c_qJv-d-kInNf-7d9jJmsN1u-T96i-aM";

    let supabaseClient = null;
    if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // アプリデータ管理オブジェクト
    let quizData = {
        globalBackgrounds: [],
        questions: []
    };

    // ゲーム進行用状態変数
    let playQuestions = [];
    let currentQIndex = 0;
    let totalRounds = 0;
    let balloonCount = 100;
    let bgMode = 'random'; // 'random' または 'fixed'
    let selectedGlobalBgIndex = 0;
    let gaugeAnimationId = null;

    // 初期化ロード
    window.addEventListener('DOMContentLoaded', () => {
        loadFromLocalStorage();
        initSetup();
        loadFromSupabase();
    });

    // Supabaseからの自動読み込み (percent_ballon カラムおよび percent_balloon カラムに両対応)
    async function loadFromSupabase() {
        const statusEl = document.getElementById('load-status');
        if (!supabaseClient) {
            if (statusEl) statusEl.innerText = "※Local Storageのデータを使用中（Supabase未連携）";
            return;
        }

        try {
            // テーブル内の全行からデータの入っているものを全取得
            const { data: rows, error } = await supabaseClient
                .from('quiz_data')
                .select('*');

            if (error) {
                console.error("Supabase読み込みエラー:", error);
                if (statusEl) {
                    statusEl.innerText = "※クラウドからのデータロードに失敗しました。";
                    statusEl.style.color = "#e24a4a";
                }
                return;
            }

            let loadedContent = null;

            if (rows && rows.length > 0) {
                // percent_ballon（uなし）または percent_balloon（uあり）のデータを探索
                for (const row of rows) {
                    const rawData = row.percent_ballon || row.percent_balloon;
                    if (rawData) {
                        loadedContent = rawData;
                        break;
                    }
                }
            }

            if (loadedContent) {
                if (typeof loadedContent === 'string') {
                    try { loadedContent = JSON.parse(loadedContent); } catch(e) {}
                }

                applyLoadedData(loadedContent);
                saveToLocalStorage();
                initSetup();

                if (statusEl) {
                    statusEl.innerText = `※クラウド(Supabase)から最新データを自動読み込みしました。（登録数: ${quizData.questions.length}問）`;
                    statusEl.style.color = "#27ae60";
                }
            } else {
                if (statusEl) statusEl.innerText = "※クラウド上に問題データが見つかりませんでした。";
            }
        } catch (err) {
            console.error("データ取得例外:", err);
            if (statusEl) {
                statusEl.innerText = "※データ取得中にエラーが発生しました。";
                statusEl.style.color = "#e24a4a";
            }
        }
    }

    // 読み込んだオブジェクト構造のパース・反映
    function applyLoadedData(data) {
        if (!data) return;

        if (Array.isArray(data)) {
            quizData.questions = data;
        } else if (typeof data === 'object') {
            if (Array.isArray(data.questions)) {
                quizData.questions = data.questions;
            }
            if (Array.isArray(data.globalBackgrounds)) {
                quizData.globalBackgrounds = data.globalBackgrounds;
            }
        }

        if (!quizData.questions) quizData.questions = [];
        if (!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
    }

    // LocalStorageからの読み込み
    function loadFromLocalStorage() {
        const local = localStorage.getItem('percent_balloon_quiz_data');
        if (local) {
            try {
                const parsed = JSON.parse(local);
                applyLoadedData(parsed);
            } catch(e) {
                console.error(e);
            }
        }
    }

    // LocalStorageへの保存
    function saveToLocalStorage() {
        localStorage.setItem('percent_balloon_quiz_data', JSON.stringify(quizData));
    }

    // JSONファイルインポート処理
    function loadJsonFile(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                let imported = JSON.parse(e.target.result);

                // 文字列で二重にパースが必要な場合に対応
                if (typeof imported === 'string') {
                    try { imported = JSON.parse(imported); } catch(err){}
                }

                applyLoadedData(imported);
                saveToLocalStorage();
                initSetup();

                const statusEl = document.getElementById('load-status');
                statusEl.innerText = `※ファイルから ${quizData.questions.length} 問を正常にインポートしました。`;
                statusEl.style.color = "#27ae60";
            } catch (err) {
                console.error("JSON Error:", err);
                alert("JSONファイルの解析に失敗しました。ファイル形式を確認してください。");
            } finally {
                input.value = ''; // 次回同じファイルを選んだときも発火するようにクリア
            }
        };
        reader.readAsText(file);
    }

    // 設定画面の初期化
    function initSetup() {
        const maxQ = quizData.questions.length;
        document.getElementById('max-q-count').innerText = maxQ;

        const countInput = document.getElementById('question-count-input');
        countInput.max = maxQ;

        if(maxQ > 0) {
            countInput.value = Math.min(5, maxQ);
            document.getElementById('start-btn').disabled = false;
        } else {
            countInput.value = 0;
            document.getElementById('start-btn').disabled = true;
        }

        // 背景画像のサムネイル選択リスト作成
        const container = document.getElementById('bg-select-container');
        container.innerHTML = '';

        if(quizData.globalBackgrounds && quizData.globalBackgrounds.length > 0) {
            quizData.globalBackgrounds.forEach((bg, index) => {
                const label = document.createElement('label');
                label.className = 'bg-option-label';
                label.innerHTML = `
                    <input type="radio" name="selected-bg" value="${index}" ${index === 0 ? 'checked' : ''}>
                    <img src="${bg}" class="setup-bg-thumb">
                `;
                container.appendChild(label);
            });
        } else {
            container.innerHTML = '<p style="font-size:12px; color:#999; margin:5px;">登録されている全体背景がありません。</p>';
        }
    }

    // 背景切り替えラジオの制御
    function toggleBgSelect() {
        bgMode = document.querySelector('input[name="bg-mode"]:checked').value;
        const container = document.getElementById('bg-select-container');
        container.style.display = (bgMode === 'fixed') ? 'flex' : 'none';
    }

    // クイズスタート処理
    function startGame() {
        const reqCount = parseInt(document.getElementById('question-count-input').value);
        if(isNaN(reqCount) || reqCount <= 0 || reqCount > quizData.questions.length) {
            alert("有効な問題数を入力してください。");
            return;
        }

        if (bgMode === 'fixed') {
            const selectedRadio = document.querySelector('input[name="selected-bg"]:checked');
            if (selectedRadio) {
                selectedGlobalBgIndex = parseInt(selectedRadio.value);
            }
        }

        // 問題のランダム抽出
        const shuffled = [...quizData.questions].sort(() => 0.5 - Math.random());
        playQuestions = shuffled.slice(0, reqCount);

        totalRounds = playQuestions.length;
        currentQIndex = 0;
        balloonCount = 100;

        document.getElementById('balloon-val').innerText = balloonCount;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        loadQuestion();
    }

    // 問題の読み込み
    function loadQuestion() {
        const q = playQuestions[currentQIndex];

        // 問題番号と文章
        document.getElementById('q-number').innerText = `第 ${currentQIndex + 1} 問 / 全 ${totalRounds} 問`;
        document.getElementById('q-text').innerText = q.question;

        // 問題イメージ画像
        const imgEl = document.getElementById('q-image');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        // 背景画像の適用ロジック（旧式復元）
        let activeBg = '';
        if (bgMode === 'fixed') {
            if (quizData.globalBackgrounds && quizData.globalBackgrounds[selectedGlobalBgIndex]) {
                activeBg = quizData.globalBackgrounds[selectedGlobalBgIndex];
            }
        } else {
            // random（全体背景からランダム。または問題個別画像）
            if (quizData.globalBackgrounds && quizData.globalBackgrounds.length > 0) {
                const randIndex = Math.floor(Math.random() * quizData.globalBackgrounds.length);
                activeBg = quizData.globalBackgrounds[randIndex];
            } else if (q.background) {
                activeBg = q.background;
            }
        }

        if (activeBg) {
            document.body.style.backgroundImage = `url("${activeBg}")`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        } else {
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = 'var(--default-bg)';
        }

        // UI状態の初期化
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').disabled = false;
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';

        document.getElementById('user-line').style.display = 'none';
        document.getElementById('correct-line').style.display = 'none';

        const gaugeBar = document.getElementById('gauge-bar');
        gaugeBar.style.width = '100%';
        document.getElementById('result-message').innerHTML = '';
    }

    // 回答ボタン押下処理
    function submitAnswer() {
        const inputEl = document.getElementById('user-input');
        const userAns = parseInt(inputEl.value);

        if (isNaN(userAns) || userAns < 0 || userAns > 100) {
            alert("0から100の間の数値を入力してください。");
            return;
        }

        inputEl.disabled = true;
        document.getElementById('submit-btn').disabled = true;

        const q = playQuestions[currentQIndex];
        const correctAns = parseInt(q.answer);

        const userLine = document.getElementById('user-line');
        userLine.style.left = userAns + '%';
        userLine.style.display = 'block';

        animateGauge(userAns, correctAns, () => {
            const correctLine = document.getElementById('correct-line');
            correctLine.style.left = correctAns + '%';
            correctLine.style.display = 'block';

            const diff = Math.abs(userAns - correctAns);
            const msgEl = document.getElementById('result-message');

            if (diff === 0) {
                msgEl.innerHTML = `<h1 style="color:#2ecc71; text-shadow:0 0 10px #fff; font-size:40px; margin:0;">ピタリ正解！ (誤差 0%)</h1>`;
            } else {
                msgEl.innerHTML = `<h1 style="color:#e24a4a; text-shadow:0 0 10px #fff; font-size:36px; margin:0;">正解は ${correctAns}% （誤差 ${diff}%）</h1>`;
            }

            balloonCount -= diff;
            if (balloonCount < 0) balloonCount = 0;
            document.getElementById('balloon-val').innerText = balloonCount;

            if (balloonCount === 0) {
                setTimeout(() => {
                    endGame(false);
                }, 1500);
            } else {
                showNextControls();
            }
        });
    }

    // ゲージの減少アニメーション
    function animateGauge(userPercent, targetPercent, onComplete) {
        const gaugeBar = document.getElementById('gauge-bar');
        let currentWidth = userPercent;

        if (currentWidth <= targetPercent) {
            setTimeout(onComplete, 500);
            return;
        }

        const duration = 2000;
        const startVal = currentWidth;
        const endVal = targetPercent;
        const startTime = performance.now();

        function step(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            currentWidth = startVal - (startVal - endVal) * progress;
            gaugeBar.style.width = currentWidth + '%';

            if (progress < 1) {
                gaugeAnimationId = requestAnimationFrame(step);
            } else {
                gaugeBar.style.width = targetPercent + '%';
                onComplete();
            }
        }

        gaugeAnimationId = requestAnimationFrame(step);
    }

    // 「次の問題へ」または「結果表示」の制御
    function showNextControls() {
        document.getElementById('submit-btn').style.display = 'none';
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'inline-block';

        if (currentQIndex + 1 >= totalRounds) {
            nextBtn.innerText = "最終結果を見る";
        } else {
            nextBtn.innerText = "次の問題へ";
        }
    }

    // 次の問題に進む
    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex >= totalRounds) {
            endGame(true);
        } else {
            loadQuestion();
        }
    }

    // ゲーム終了（クリア or オーバー）
    function endGame(isClear) {
        document.getElementById('game-screen').style.display = 'none';

        const resultScreen = document.getElementById('result-screen');
        const titleEl = document.getElementById('result-title');
        const descEl = document.getElementById('result-desc');

        resultScreen.style.display = 'block';

        if (isClear) {
            titleEl.innerText = "🎉 GAME CLEAR!";
            titleEl.style.color = "var(--success-color)";
            descEl.innerText = `おめでとうございます！\n設定された ${totalRounds} 問をすべてクリアしました。\n\n残った風船の数: ${balloonCount} 個`;
        } else {
            titleEl.innerText = "💥 GAME OVER";
            titleEl.style.color = "var(--danger-color)";
            descEl.innerText = `残念！風船がすべて割れてしまいました…\n\n到達: 第 ${currentQIndex + 1} 問 / 全 ${totalRounds} 問`;
        }
    }
</script>
