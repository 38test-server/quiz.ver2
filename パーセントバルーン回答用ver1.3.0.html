<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーセントバルーン風 クイズ回答ブラウザ</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e24a4a;
            --default-bg: lightskyblue;
            --ui-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--default-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 画面共通のホワイトパネルスタイル */
        .panel {
            background: var(--ui-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1, h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .btn-danger {
            background-color: var(--danger-color);
        }

        /* --- 設定画面 --- */
        #setup-screen .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        #setup-screen label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        #setup-screen input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .bg-options {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .bg-thumb-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            background: #fff;
        }
        .bg-option-label {
            position: relative;
            cursor: pointer;
        }
        .bg-option-label input {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 1;
        }
        .setup-bg-thumb {
            width: 100px;
            height: 56.25px; /* 16:9 */
            object-fit: cover;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .bg-option-label input:checked + .setup-bg-thumb {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        /* --- ゲーム画面 --- */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 上部問題エリア */
        .question-box {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: var(--ui-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        #q-number {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #q-text {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }

        /* 中央イメージ画像 */
        .image-container {
            position: absolute;
            top: 160px;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #q-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.5);
        }

        /* 下部中央：パーセントゲージ */
        .gauge-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            height: 45px;
            background-color: #5c3a21; /* 下地：茶色 */
            border: 4px solid #3d2514;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .gauge-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to bottom, #ffe066 0%, #f5b041 100%); 
        }
        /* ゲージ内の補助線(50%位置) */
        .gauge-center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0,0,0,0.2);
            border-left: 1px dashed rgba(255,255,255,0.4);
        }
        /* 回答者が選んだ場所のライン */
        .user-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            display: none;
            transform: translateX(-50%);
            z-index: 5;
        }
        /* 正解の場所を示すライン */
        .correct-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            display: none;
            transform: translateX(-50%);
            z-index: 4;
        }
        .gauge-labels {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            font-size: 14px;
            padding: 0 10px;
        }

        /* 左下：入力欄エリア */
        .input-area {
            position: fixed;
            left: 40px;
            bottom: 25px;
            background: var(--ui-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        .input-area input {
            width: 80px;
            font-size: 22px;
            padding: 6px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-weight: bold;
        }
        .input-area span {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        /* 右下：風船カウンターエリア */
        .balloon-counter {
            position: fixed;
            right: 45px;
            bottom: 35px;
            width: 110px;
            height: 135px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #ff6b8b;
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.4);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(150,40,70,0.4);
            z-index: 10;
            animation: float 3s ease-in-out infinite alternate;
        }
        .balloon-counter::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 5px 0 5px;
            border-style: solid;
            border-color: #ff6b8b transparent transparent transparent;
        }
        .balloon-label {
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .balloon-num {
            font-size: 38px;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* 中央メッセージ表示 */
        #result-message {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        /* --- 結果画面 (ランキング対応) --- */
        #result-screen {
            display: none;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px 30px;
        }
        #result-title {
            font-size: 32px;
            margin-bottom: 5px;
        }
        #result-desc {
            font-size: 16px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            line-height: 1.4;
            color: #333;
        }

        /* ランキングのレイアウト */
        .rankings-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .ranking-card {
            flex: 1;
            min-width: 280px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .ranking-card h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 1.1rem;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 5px;
        }
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            background-color: #fafafa;
        }
        .ranking-table th, .ranking-table td {
            padding: 6px 8px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
            color: #333;
        }
        .ranking-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: bold;
        }
        .ranking-table tr.highlight {
            background-color: #ffe4e6;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div id="setup-screen" class="panel">
        <h1>🎈 パーセントバルーン クイズ</h1>
        <hr style="margin-bottom:20px; border:0; border-top:1px solid #eee;">
        
        <div class="form-group">
            <label>1. 問題データのインポート</label>
            <input type="file" id="json-file-input" accept=".json" onchange="loadJsonFile(this)">
            <p id="load-status" style="font-size:13px; color:#666; margin:5px 0 0 0;">
                Supabaseから問題データを読み込み中...
            </p>
        </div>

        <div class="form-group">
            <label for="question-count-input">2. 挑戦する問題数 (登録済: <span id="max-q-count">0</span>問)</label>
            <input type="number" id="question-count-input" min="1" value="0">
        </div>

        <div class="form-group">
            <label>3. 背景画像の設定</label>
            <div class="bg-options">
                <label><input type="radio" name="bg-mode" value="random" checked onchange="toggleBgSelect()"> 全体背景からランダム</label>
                <label><input type="radio" name="bg-mode" value="select" onchange="toggleBgSelect()"> 任意の1枚に固定</label>
            </div>
            <div id="bg-select-container" class="bg-thumb-container" style="display:none;"></div>
        </div>

        <button id="start-btn" class="btn" onclick="startGame()" style="width:100%; margin-top:10px;" disabled>ゲームスタート</button>
    </div>

    <div id="game-screen">
        <div class="question-box">
            <div id="q-number">第 1 問</div>
            <p id="q-text">問題文がここに表示されます</p>
        </div>

        <div class="image-container">
            <img id="q-image" src="" alt="問題イメージ" style="display:none;">
        </div>

        <div id="result-message"></div>

        <div class="gauge-labels">
            <span>0%</span>
            <span style="position:absolute; left:50%; transform:translateX(-50%);">50%</span>
            <span>100%</span>
        </div>

        <div class="gauge-container">
            <div id="gauge-bar" class="gauge-bar"></div>
            <div class="gauge-center-line"></div>
            <div id="user-line" class="user-line"></div>
            <div id="correct-line" class="correct-line"></div>
        </div>

        <div class="input-area">
            <input type="number" id="user-input" min="0" max="100" placeholder="0">
            <span>%</span>
            <button id="submit-btn" class="btn" onclick="submitAnswer()">回答</button>
            <button id="next-btn" class="btn" onclick="nextQuestion()" style="display:none; background-color:var(--success-color);">次の問題へ</button>
        </div>

        <div class="balloon-counter">
            <div class="balloon-label">BALLOON</div>
            <div id="balloon-num" class="balloon-num">100</div>
        </div>
    </div>

    <div id="result-screen" class="panel">
        <h1 id="result-title">GAME CLEAR!</h1>
        <p id="result-desc">ゲーム終了時の説明</p>

        <!-- ランキング領域 -->
        <div class="rankings-wrapper">
            <div class="ranking-card">
                <h3>今日のランキング (Top 10)</h3>
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>ポイント</th>
                            <th>タイム</th>
                        </tr>
                    </thead>
                    <tbody id="todayRankingBody">
                        <tr><td colspan="3">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="ranking-card">
                <h3>総合ランキング (Top 10)</h3>
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>ポイント</th>
                            <th>タイム</th>
                        </tr>
                    </thead>
                    <tbody id="totalRankingBody">
                        <tr><td colspan="3">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-danger" onclick="closeApp()">ゲームを終了</button>
            <button class="btn" onclick="returnToTitle()">タイトルに戻る</button>
        </div>
    </div>

<script>
    // Supabase 設定
    const SUPABASE_URL = 'https://vnnuqbndesdemwacneqf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ozF0vXC-dHA_lp_tDWSKIw_MYPufRCc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const QUIZ_DATA_ROW_ID = 'main_quiz_data';

    // ==========================================
    // カスタマイズ用設定（風船割れ効果音関連）
    // ==========================================
    const BURST_SOUND_PATH = 'assets/balloon_burst1.mp3'; // 効果音ファイルパス
    const BURST_INTERVAL_MIN = 50;                        // 割れる間隔の最小値（ミリ秒: 0.06秒）
    const BURST_INTERVAL_MAX = 80;                        // 割れる間隔の最大値（ミリ秒: 0.09秒）

    // 効果音用のAudioインスタンス初期化
    const burstAudioTemplate = new Audio(BURST_SOUND_PATH);

    // 効果音を連続再生するための関数
    function playBurstSound() {
        try {
            const sound = burstAudioTemplate.cloneNode();
            sound.currentTime = 0;
            sound.play().catch(e => {
                // 自動再生ポリシーなどで再生がブロックされた場合の対応
                console.warn("Audio play blocked", e);
            });
        } catch (e) {
            console.error("Audio play error", e);
        }
    }

    // ゲームデータ保持用
    let quizData = { globalBackgrounds: [], questions: [] };
    let playQuestions = [];
    let currentQIndex = 0;
    let balloonCount = 100;
    let totalRounds = 0;
    let fixedBgIndex = 0;
    let bgMode = 'random';

    // タイム計測・レコード保持用
    let gameStartTime = 0;
    let finalElapsedTime = 0;
    let currentRecordId = null;

    // 起動時に Supabase から quiz_data の percent_balloon を取得
    window.onload = async function() {
        const statusEl = document.getElementById('load-status');
        try {
            const { data, error } = await supabaseClient
                .from('quiz_data')
                .select('percent_balloon')
                .eq('id', QUIZ_DATA_ROW_ID)
                .single();

            if (error || !data || !data.percent_balloon) {
                statusEl.innerText = "Supabaseからの問題データ取得に失敗しました。";
                statusEl.style.color = "red";
                return;
            }

            let loadedData = data.percent_balloon;
            if (typeof loadedData === 'string') {
                loadedData = JSON.parse(loadedData);
            }

            quizData = loadedData;
            if(!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
            if(!quizData.questions) quizData.questions = [];

            // 初回読み込み成功時に localStorage へバックアップ保存（タイトルに戻る時用）
            try {
                localStorage.setItem('balloon_quiz_data', JSON.stringify(quizData));
            } catch(e) {
                console.warn("Storage quota exceeded", e);
            }

            initSetup();
            statusEl.innerText = "Supabaseから問題データを読み込みました！";
            statusEl.style.color = "green";

        } catch (e) {
            console.error("Supabaseデータ取得エラー", e);
            statusEl.innerText = "問題データの読み込み中にエラーが発生しました。";
            statusEl.style.color = "red";
        }
    };

    // JSONファイルのアップロード処理
    function loadJsonFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                quizData = JSON.parse(e.target.result);
                if(!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
                if(!quizData.questions) quizData.questions = [];
                
                // 容量制限（5MB）をチェックして localStorage 保存
                try {
                    const dataStr = JSON.stringify(quizData);
                    if (dataStr.length < 5 * 1024 * 1024) {
                        localStorage.setItem('balloon_quiz_data', dataStr);
                    }
                } catch(e) {
                    console.warn("Storage quota exceeded", e);
                }

                initSetup();
                document.getElementById('load-status').innerText = "JSONファイルから読み込みました！";
                document.getElementById('load-status').style.color = "green";
            } catch(err) {
                alert("JSONファイルの解析に失敗しました。形式を確認してください。");
            }
        };
        reader.readAsText(file);
    }

    // 設定画面の初期化
    function initSetup() {
        const maxQ = quizData.questions.length;
        document.getElementById('max-q-count').innerText = maxQ;
        
        const countInput = document.getElementById('question-count-input');
        countInput.max = maxQ;
        if(maxQ > 0) {
            countInput.value = Math.min(5, maxQ);
            document.getElementById('start-btn').disabled = false;
        } else {
            countInput.value = 0;
            document.getElementById('start-btn').disabled = true;
        }

        const container = document.getElementById('bg-select-container');
        container.innerHTML = '';
        if(quizData.globalBackgrounds.length > 0) {
            quizData.globalBackgrounds.forEach((bg, index) => {
                const label = document.createElement('label');
                label.className = 'bg-option-label';
                label.innerHTML = `
                    <input type="radio" name="selected-bg" value="${index}" ${index === 0 ? 'checked' : ''}>
                    <img src="${bg}" class="setup-bg-thumb">
                `;
                container.appendChild(label);
            });
        } else {
            container.innerHTML = '<p style="font-size:12px; color:#999; margin:5px;">登録されている全体背景がありません。</p>';
        }
    }

    function toggleBgSelect() {
        bgMode = document.querySelector('input[name="bg-mode"]:checked').value;
        const container = document.getElementById('bg-select-container');
        container.style.display = (bgMode === 'select') ? 'flex' : 'none';
    }

    // ゲーム開始
    function startGame() {
        const countInput = document.getElementById('question-count-input');
        totalRounds = parseInt(countInput.value);

        if (isNaN(totalRounds) || totalRounds <= 0 || totalRounds > quizData.questions.length) {
            alert("正しい問題数を指定してください。");
            return;
        }

        if (bgMode === 'select' && quizData.globalBackgrounds.length > 0) {
            const checkedRadio = document.querySelector('input[name="selected-bg"]:checked');
            fixedBgIndex = checkedRadio ? parseInt(checkedRadio.value) : 0;
        }

        playQuestions = [...quizData.questions].sort(() => 0.5 - Math.random()).slice(0, totalRounds);

        balloonCount = 100;
        currentQIndex = 0;
        currentRecordId = null;
        gameStartTime = Date.now(); // タイム計測開始

        document.getElementById('balloon-num').innerText = balloonCount;

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        loadQuestion();
    }

    function loadQuestion() {
        const q = playQuestions[currentQIndex];

        document.getElementById('q-number').innerText = `第 ${currentQIndex + 1} 問 / 全 ${totalRounds} 問`;
        document.getElementById('q-text').innerText = q.question;

        const imgEl = document.getElementById('q-image');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
            imgEl.src = '';
        }

        let currentBg = "";
        if (q.background) {
            currentBg = q.background;
        } else if (bgMode === 'random' && quizData.globalBackgrounds.length > 0) {
            const randIdx = Math.floor(Math.random() * quizData.globalBackgrounds.length);
            currentBg = quizData.globalBackgrounds[randIdx];
        } else if (bgMode === 'select' && quizData.globalBackgrounds.length > 0) {
            currentBg = quizData.globalBackgrounds[fixedBgIndex];
        }

        if (currentBg) {
            document.body.style.backgroundImage = `url(${currentBg})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        } else {
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = 'lightskyblue';
        }

        document.getElementById('user-input').value = '';
        document.getElementById('user-input').disabled = false;
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        document.getElementById('user-line').style.display = 'none';
        document.getElementById('correct-line').style.display = 'none';
        document.getElementById('gauge-bar').style.width = '100%';
        document.getElementById('result-message').innerHTML = '';
    }

    function submitAnswer() {
        const inputEl = document.getElementById('user-input');
        const userAns = parseInt(inputEl.value);

        if (isNaN(userAns) || userAns < 0 || userAns > 100) {
            alert("0から100の間の数値を入力してください。");
            return;
        }

        inputEl.disabled = true;
        document.getElementById('submit-btn').disabled = true;

        const q = playQuestions[currentQIndex];
        const correctAns = q.answer;

        const userLine = document.getElementById('user-line');
        userLine.style.left = userAns + '%';
        userLine.style.display = 'block';

        animateGauge(userAns, correctAns, () => {
            handleScoreCalculation(userAns, correctAns);
        });
    }

    function animateGauge(userAns, correctAns, callback) {
        const gaugeBar = document.getElementById('gauge-bar');
        const percentPerSecond = 20;
        const intervalMs = 20;
        const step = percentPerSecond * (intervalMs / 1000);

        let currentPercent = 0;

        if (userAns <= 50) {
            currentPercent = 0;
            gaugeBar.style.width = '0%';

            const timer = setInterval(() => {
                currentPercent += step;
                if (currentPercent >= correctAns) {
                    currentPercent = correctAns;
                    clearInterval(timer);
                    endAnim();
                }
                gaugeBar.style.width = currentPercent + '%';
            }, intervalMs);

        } else {
            currentPercent = 100;
            gaugeBar.style.width = '100%';

            const timer = setInterval(() => {
                currentPercent -= step;
                if (currentPercent <= correctAns) {
                    currentPercent = correctAns;
                    clearInterval(timer);
                    endAnim();
                }
                gaugeBar.style.width = currentPercent + '%';
            }, intervalMs);
        }

        function endAnim() {
            const correctLine = document.getElementById('correct-line');
            correctLine.style.left = correctAns + '%';
            correctLine.style.display = 'block';
            setTimeout(callback, 800);
        }
    }

    function handleScoreCalculation(userAns, correctAns) {
        const diff = Math.abs(userAns - correctAns);
        const msgEl = document.getElementById('result-message');

        if (diff === 0) {
            balloonCount += 10;
            document.getElementById('balloon-num').innerText = balloonCount;
            msgEl.innerHTML = `<h2 style="color: #ff3377; font-size: 28px; text-shadow: 0 0 10px #fff;">🎯 ピッタリ！風船+10個ボーナス！</h2>`;
            showNextControls();
        } else {
            msgEl.innerHTML = `<h2 style="color: #2c3e50; font-size: 24px; text-shadow: 0 0 5px #fff;">正解は ${correctAns}% （誤差: -${diff}）</h2>`;
            
            let count = 0;
            
            // 0.06秒〜0.09秒（60ms〜90ms）の間隔で風船を減らしつつ効果音を鳴らす処理
            function processCountdown() {
                if (count < diff && balloonCount > 0) {
                    balloonCount--;
                    document.getElementById('balloon-num').innerText = balloonCount;
                    playBurstSound(); // 効果音再生
                    count++;

                    // BURST_INTERVAL_MIN 〜 BURST_INTERVAL_MAX の範囲でランダムな時間を計算
                    const randomDelay = Math.floor(Math.random() * (BURST_INTERVAL_MAX - BURST_INTERVAL_MIN + 1)) + BURST_INTERVAL_MIN;
                    setTimeout(processCountdown, randomDelay);
                } else {
                    if (balloonCount <= 0) {
                        setTimeout(() => { endGame(false); }, 1000);
                    } else {
                        showNextControls();
                    }
                }
            }

            processCountdown();
        }
    }

    function showNextControls() {
        document.getElementById('submit-btn').style.display = 'none';
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'inline-block';
        
        if (currentQIndex + 1 >= totalRounds) {
            nextBtn.innerText = "最終結果を見る";
        } else {
            nextBtn.innerText = "次の問題へ";
        }
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex >= totalRounds) {
            endGame(true);
        } else {
            loadQuestion();
        }
    }

    // ゲーム終了（スコア計算 & Supabase保存 & ランキングロード）
    async function endGame(isClear) {
        finalElapsedTime = parseFloat(((Date.now() - gameStartTime) / 1000).toFixed(2));
        
        // ポイント計算: 解いた問題数（到達問題数） + 残った風船数
        const solvedQuestions = isClear ? totalRounds : currentQIndex;
        const totalPoints = solvedQuestions + balloonCount;

        document.getElementById('game-screen').style.display = 'none';
        
        const resultScreen = document.getElementById('result-screen');
        const titleEl = document.getElementById('result-title');
        const descEl = document.getElementById('result-desc');
        
        resultScreen.style.display = 'block';

        if (isClear) {
            titleEl.innerText = "🎉 GAME CLEAR!";
            titleEl.style.color = "var(--success-color)";
            descEl.innerText = `おめでとうございます！ 全 ${totalRounds} 問クリア！\n獲得ポイント: ${totalPoints} pt (クリア問題数: ${solvedQuestions} + 残風船: ${balloonCount})`;
        } else {
            titleEl.innerText = "💥 GAME OVER";
            titleEl.style.color = "var(--danger-color)";
            descEl.innerText = `残念！風船が割れてしまいました。\n獲得ポイント: ${totalPoints} pt (クリア問題数: ${solvedQuestions} + 残風船: ${balloonCount})`;
        }

        // Supabase スコア保存
        await saveScore(totalPoints, finalElapsedTime);
        // ランキング読み込み
        await loadRankings();
    }

    // スコアの記録
    async function saveScore(points, time) {
        try {
            const { data, error } = await supabaseClient
                .from('daily_records_ballon')
                .insert([{
                    percent_ballon: points,
                    percent_ballon_time: time
                }])
                .select();

            if (!error && data && data.length > 0) {
                currentRecordId = data[0].id;
            }
        } catch (e) {
            console.error('スコア記録エラー:', e);
        }
    }

    // ランキングデータの取得と描画
    async function loadRankings() {
        const todayBody = document.getElementById('todayRankingBody');
        const totalBody = document.getElementById('totalRankingBody');
        todayBody.innerHTML = '<tr><td colspan="3">読み込み中...</td></tr>';
        totalBody.innerHTML = '<tr><td colspan="3">読み込み中...</td></tr>';

        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);

        try {
            // 今日の全記録
            const { data: todayData } = await supabaseClient
                .from('daily_records_ballon')
                .select('*')
                .gte('created_at', todayStart.toISOString())
                .order('percent_ballon', { ascending: false })
                .order('percent_ballon_time', { ascending: true });

            // 総合の全記録
            const { data: totalData } = await supabaseClient
                .from('daily_records_ballon')
                .select('*')
                .order('percent_ballon', { ascending: false })
                .order('percent_ballon_time', { ascending: true });

            processAndRenderRanking(todayBody, todayData);
            processAndRenderRanking(totalBody, totalData);

        } catch (e) {
            console.error('ランキング読み込みエラー:', e);
            todayBody.innerHTML = '<tr><td colspan="3">取得失敗</td></tr>';
            totalBody.innerHTML = '<tr><td colspan="3">取得失敗</td></tr>';
        }
    }

    function processAndRenderRanking(targetEl, list) {
        if (!list || list.length === 0) {
            targetEl.innerHTML = '<tr><td colspan="3">記録がありません</td></tr>';
            return;
        }

        const rankedList = list.map((item, index) => ({
            ...item,
            rank: index + 1
        }));

        let displayList = rankedList.slice(0, 10);

        if (currentRecordId) {
            const myRankIndex = rankedList.findIndex(item => item.id === currentRecordId);
            if (myRankIndex >= 10) {
                const myRecord = rankedList[myRankIndex];
                displayList[9] = myRecord; // 10番目の位置に自分の実順位レコードを配置
            }
        }

        renderRankingTable(targetEl, displayList);
    }

    function renderRankingTable(targetEl, list) {
        targetEl.innerHTML = '';
        list.forEach((item) => {
            const tr = document.createElement('tr');
            if (currentRecordId && item.id === currentRecordId) {
                tr.classList.add('highlight');
            }

            const timeStr = item.percent_ballon_time ? `${parseFloat(item.percent_ballon_time).toFixed(2)}秒` : '-';

            tr.innerHTML = `
                <td>${item.rank}位</td>
                <td>${item.percent_ballon} pt</td>
                <td>${timeStr}</td>
            `;
            targetEl.appendChild(tr);
        });
    }

    // タイトルに戻る（リロードせずUIのみ切り替え、localStorageから直前のデータを読み込んで表示）
    function returnToTitle() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';

        // 背景色・画像を初期状態に戻す
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = 'var(--default-bg)';

        const localData = localStorage.getItem('balloon_quiz_data');
        if (localData) {
            try {
                quizData = JSON.parse(localData);
            } catch(e) {
                console.error("Localstorage読み込みエラー", e);
            }
        }

        initSetup();
    }

    // ゲームを終了（タブを閉じる）
    function closeApp() {
        window.close();
        setTimeout(() => {
            alert('ブラウザのタブを手動で閉じて終了してください。');
        }, 300);
    }
</script>
