<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーセントバルーン風 クイズ回答ブラウザ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e24a4a;
            --default-bg: lightskyblue;
            --ui-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--default-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 画面共通のホワイトパネルスタイル */
        .panel {
            background: var(--ui-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1, h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* --- 設定画面 --- */
        #setup-screen .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        #setup-screen label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        #setup-screen input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .bg-options {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .bg-thumb-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            background: #fff;
        }
        .bg-option-label {
            position: relative;
            cursor: pointer;
        }
        .bg-option-label input {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 1;
        }
        .setup-bg-thumb {
            width: 100px;
            height: 56.25px; /* 16:9 */
            object-fit: cover;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .bg-option-label input:checked + .setup-bg-thumb {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        /* --- ゲーム画面 --- */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 上部問題エリア */
        .question-box {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: var(--ui-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        #q-number {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #q-text {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }

        /* 中央イメージ画像 */
        .image-container {
            position: absolute;
            top: 160px;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #q-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.5);
        }

        /* 下部中央：パーセントゲージ */
        .gauge-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            height: 45px;
            background-color: #5c3a21; /* 下地：茶色 */
            border: 4px solid #3d2514;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .gauge-bar {
            height: 100%;
            width: 100%;
            /* ゲージ本体：黄色基調 */
            background: linear-gradient(to bottom, #ffe066 0%, #f5b041 100%); 
            width: 100%; /* 初期は満タン */
        }
        /* ゲージ内の補助線(50%位置) */
        .gauge-center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0,0,0,0.2);
            border-left: 1px dashed rgba(255,255,255,0.4);
        }
        /* 回答者が選んだ場所のライン */
        .user-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            display: none;
            transform: translateX(-50%);
            z-index: 5;
        }
        /* 正解の場所を示すライン (演出終了時にわかりやすく表示) */
        .correct-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            display: none;
            transform: translateX(-50%);
            z-index: 4;
        }
        .gauge-labels {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            font-size: 14px;
            padding: 0 10px;
        }

        /* 左下：入力欄エリア */
        .input-area {
            position: fixed;
            left: 40px;
            bottom: 25px;
            background: var(--ui-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        .input-area input {
            width: 80px;
            font-size: 22px;
            padding: 6px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-weight: bold;
        }
        .input-area span {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        /* 右下：風船カウンターエリア（ピンク基調・グラデーション） */
        .balloon-counter {
            position: fixed;
            right: 45px;
            bottom: 35px;
            width: 110px;
            height: 135px;
            /* ピンク基調の風船イメージグラデーション */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; /* 風船っぽい形 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #ff6b8b;
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.4);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(150,40,70,0.4);
            z-index: 10;
            animation: float 3s ease-in-out infinite alternate;
        }
        /* 風船の結び目パーツ */
        .balloon-counter::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 5px 0 5px;
            border-style: solid;
            border-color: #ff6b8b transparent transparent transparent;
        }
        .balloon-label {
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .balloon-num {
            font-size: 38px;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* 中央メッセージ表示 */
        #result-message {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        /* --- 結果画面 --- */
        #result-screen {
            display: none;
        }
        #result-title {
            font-size: 36px;
            margin-bottom: 15px;
        }
        #result-desc {
            font-size: 18px;
            margin-bottom: 30px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="setup-screen" class="panel">
        <h1>🎈 パーセントバルーン クイズ</h1>
        <hr style="margin-bottom:20px; border:0; border-top:1px solid #eee;">
        
        <div class="form-group">
            <label>1. 問題データの読み込み (Supabase / JSON)</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <button type="button" class="btn" style="padding: 8px 16px; font-size: 14px;" onclick="fetchFromSupabase(true)">☁️ クラウドから問題再読み込み</button>
                <input type="file" id="json-file-input" accept=".json" onchange="loadJsonFile(this)" style="display:none;">
                <button type="button" class="btn" style="background-color:#7f8c8d; padding: 8px 16px; font-size: 14px;" onclick="document.getElementById('json-file-input').click()">JSON読み込み</button>
            </div>
            <p id="load-status" style="font-size:13px; color:#666; margin:5px 0 0 0;">
                Supabaseからデータを読み込んでいます...
            </p>
        </div>

        <div class="form-group">
            <label for="question-count-input">2. 挑戦する問題数 (登録済: <span id="max-q-count">0</span>問)</label>
            <input type="number" id="question-count-input" min="1" value="0">
        </div>

        <div class="form-group">
            <label>3. 背景画像の設定</label>
            <div class="bg-options">
                <label><input type="radio" name="bg-mode" value="random" checked onchange="toggleBgSelect()"> 全体背景からランダム</label>
                <label><input type="radio" name="bg-mode" value="select" onchange="toggleBgSelect()"> 任意の1枚に固定</label>
            </div>
            <div id="bg-select-container" class="bg-thumb-container" style="display:none;">
                </div>
        </div>

        <button id="start-btn" class="btn" onclick="startGame()" style="width:100%; margin-top:10px;" disabled>ゲームスタート</button>
    </div>

    <div id="game-screen">
        <div class="question-box">
            <div id="q-number">第 1 問</div>
            <p id="q-text">問題文がここに表示されます</p>
        </div>

        <div class="image-container">
            <img id="q-image" src="" alt="問題イメージ" style="display:none;">
        </div>

        <div id="result-message"></div>

        <div class="gauge-labels">
            <span>0%</span>
            <span style="position:absolute; left:50%; transform:translateX(-50%);">50%</span>
            <span>100%</span>
        </div>

        <div class="gauge-container">
            <div id="gauge-bar" class="gauge-bar"></div>
            <div class="gauge-center-line"></div>
            <div id="user-line" class="user-line"></div>
            <div id="correct-line" class="correct-line"></div>
        </div>

        <div class="input-area">
            <input type="number" id="user-input" min="0" max="100" placeholder="0">
            <span>%</span>
            <button id="submit-btn" class="btn" onclick="submitAnswer()">回答</button>
            <button id="next-btn" class="btn" onclick="nextQuestion()" style="display:none; background-color:var(--success-color);">次の問題へ</button>
        </div>

        <div class="balloon-counter">
            <div class="balloon-label">BALLOON</div>
            <div id="balloon-num" class="balloon-num">100</div>
        </div>
    </div>

    <div id="result-screen" class="panel">
        <h1 id="result-title">GAME CLEAR!</h1>
        <p id="result-desc">ゲーム終了時の説明</p>
        <button class="btn" onclick="location.reload()">タイトルに戻る</button>
    </div>


<script>
    // --- Supabaseの設定 ---
    const SUPABASE_URL = 'https://vnnuqbndesdemwacneqf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ozF0vXC-dHA_lp_tDWSKIw_MYPufRCc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const QUIZ_DATA_ROW_ID = 'main_quiz_data';

    // ゲームデータ保持用
    let quizData = { globalBackgrounds: [], questions: [] };
    let playQuestions = [];
    let currentQIndex = 0;
    let balloonCount = 100;
    let totalRounds = 0;
    let fixedBgIndex = 0;
    let bgMode = 'random';

    // 起動時にSupabaseから自動取得を試みる
    window.onload = function() {
        fetchFromSupabase(false);
    };

    // Supabaseからデータを読み込む関数
    async function fetchFromSupabase(isManual = false) {
        const statusEl = document.getElementById('load-status');
        if (isManual && statusEl) {
            statusEl.innerText = "クラウドからデータを読み込み中...";
            statusEl.style.color = "#666";
        }

        try {
            const { data, error } = await supabaseClient
                .from('quiz_data')
                .select('percent_balloon')
                .eq('id', QUIZ_DATA_ROW_ID)
                .single();

            if (error && error.code !== 'PGRST116') {
                console.error("Supabase読み込みエラー:", error);
                if (statusEl) {
                    statusEl.innerText = "Supabaseからのデータ読み込みに失敗しました。";
                    statusEl.style.color = "red";
                }
                return;
            }

            if (data && data.percent_balloon) {
                let fetchedData = data.percent_balloon;

                // オブジェクト/配列形式の補正
                if (Array.isArray(fetchedData)) {
                    quizData = { globalBackgrounds: [], questions: fetchedData };
                } else if (typeof fetchedData === 'object' && fetchedData !== null) {
                    quizData = fetchedData;
                    if (!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
                    if (!quizData.questions) quizData.questions = [];
                }

                initSetup();
                if (statusEl) {
                    statusEl.innerText = "Supabaseから問題データを正常に取得しました！";
                    statusEl.style.color = "green";
                }
            } else {
                if (statusEl) {
                    statusEl.innerText = "クラウドに保存されたパーセントバルーン問題が見つかりませんでした。";
                    statusEl.style.color = "#e67e22";
                }
            }
        } catch (e) {
            console.error("Supabase通信エラー:", e);
            if (statusEl) {
                statusEl.innerText = "通信エラーが発生しました。";
                statusEl.style.color = "red";
            }
        }
    }

    // JSONファイルのアップロード処理
    function loadJsonFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (Array.isArray(parsed)) {
                    quizData = { globalBackgrounds: [], questions: parsed };
                } else {
                    quizData = parsed;
                    if(!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
                    if(!quizData.questions) quizData.questions = [];
                }
                initSetup();
                document.getElementById('load-status').innerText = "JSONファイルから読み込みました！";
                document.getElementById('load-status').style.color = "green";
            } catch(err) {
                alert("JSONファイルの解析に失敗しました。形式を確認してください。");
            }
        };
        reader.readAsText(file);
    }

    // 設定画面の初期化
    function initSetup() {
        const maxQ = quizData.questions.length;
        document.getElementById('max-q-count').innerText = maxQ;
        
        const countInput = document.getElementById('question-count-input');
        countInput.max = maxQ;
        if(maxQ > 0) {
            countInput.value = Math.min(5, maxQ); // デフォルト5問、または最大数
            document.getElementById('start-btn').disabled = false;
        } else {
            countInput.value = 0;
            document.getElementById('start-btn').disabled = true;
        }

        // 任意背景の選択リスト作成
        const container = document.getElementById('bg-select-container');
        container.innerHTML = '';
        if(quizData.globalBackgrounds.length > 0) {
            quizData.globalBackgrounds.forEach((bg, index) => {
                const label = document.createElement('label');
                label.className = 'bg-option-label';
                label.innerHTML = `
                    <input type="radio" name="selected-bg" value="${index}" ${index === 0 ? 'checked' : ''}>
                    <img src="${bg}" class="setup-bg-thumb">
                `;
                container.appendChild(label);
            });
        } else {
            // 全体背景がない場合は任意選択ラジオを非表示に
            container.innerHTML = '<p style="font-size:12px; color:#999; margin:5px;">登録されている全体背景がありません。</p>';
        }
    }

    // 背景切り替えラジオの制御
    function toggleBgSelect() {
        bgMode = document.querySelector('input[name="bg-mode"]:checked').value;
        const container = document.getElementById('bg-select-container');
        container.style.display = (bgMode === 'select') ? 'flex' : 'none';
    }

    // ゲーム開始
    function startGame() {
        const countInput = document.getElementById('question-count-input');
        totalRounds = parseInt(countInput.value);

        if (isNaN(totalRounds) || totalRounds <= 0 || totalRounds > quizData.questions.length) {
            alert("正しい問題数を指定してください。");
            return;
        }

        // 任意背景が選ばれている場合のインデックス取得
        if (bgMode === 'select' && quizData.globalBackgrounds.length > 0) {
            const checkedRadio = document.querySelector('input[name="selected-bg"]:checked');
            fixedBgIndex = checkedRadio ? parseInt(checkedRadio.value) : 0;
        }

        // 問題リストからランダムに抽出してシャッフル
        playQuestions = [...quizData.questions].sort(() => 0.5 - Math.random()).slice(0, totalRounds);

        // 各状態リセット
        balloonCount = 100;
        currentQIndex = 0;
        document.getElementById('balloon-num').innerText = balloonCount;

        // 画面切り替え
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        loadQuestion();
    }

    // 問題の読み込みと画面反映
    function loadQuestion() {
        const q = playQuestions[currentQIndex];

        // 問題文と進行状況
        document.getElementById('q-number').innerText = `第 ${currentQIndex + 1} 問 / 全 ${totalRounds} 問`;
        document.getElementById('q-text').innerText = q.question;

        // イメージ画像
        const imgEl = document.getElementById('q-image');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
            imgEl.src = '';
        }

        // 背景画像の適用ロジック
        let currentBg = "";
        if (q.background) {
            // 1. 問題個別の背景があれば最優先
            currentBg = q.background;
        } else if (bgMode === 'random' && quizData.globalBackgrounds.length > 0) {
            // 2. 全体からランダムモード
            const randIdx = Math.floor(Math.random() * quizData.globalBackgrounds.length);
            currentBg = quizData.globalBackgrounds[randIdx];
        } else if (bgMode === 'select' && quizData.globalBackgrounds.length > 0) {
            // 3. 任意の1枚に固定モード
            currentBg = quizData.globalBackgrounds[fixedBgIndex];
        }

        if (currentBg) {
            document.body.style.backgroundImage = `url(${currentBg})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        } else {
            // 背景画像が一切ないときは薄い空色
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = 'lightskyblue';
        }

        // UIパーツのリセット
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').disabled = false;
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        document.getElementById('user-line').style.display = 'none';
        document.getElementById('correct-line').style.display = 'none';
        document.getElementById('gauge-bar').style.width = '100%'; // 最初は満タン
        document.getElementById('result-message').innerHTML = '';
    }

    // 回答ボタン押下処理
    function submitAnswer() {
        const inputEl = document.getElementById('user-input');
        const userAns = parseInt(inputEl.value);

        if (isNaN(userAns) || userAns < 0 || userAns > 100) {
            alert("0から100の間の数値を入力してください。");
            return;
        }

        // ボタンと入力欄のロック
        inputEl.disabled = true;
        document.getElementById('submit-btn').disabled = true;

        const q = playQuestions[currentQIndex];
        const correctAns = q.answer;

        // 自分の選んだ場所に赤いラインを表示
        const userLine = document.getElementById('user-line');
        userLine.style.left = userAns + '%';
        userLine.style.display = 'block';

        // ゲージのアニメーション開始
        animateGauge(userAns, correctAns, () => {
            // アニメーション完了後の処理（スコア計算と風船減少）
            handleScoreCalculation(userAns, correctAns);
        });
    }

    // ゲージのアニメーション制御
    function animateGauge(userAns, correctAns, callback) {
        const gaugeBar = document.getElementById('gauge-bar');
        
        // 速度の定義：1秒に20% (50%に達するのに2.5秒かかる速度)
        const percentPerSecond = 20;
        const intervalMs = 20; // 20ミリ秒ごとに更新
        const step = percentPerSecond * (intervalMs / 1000); // 1ステップあたりの増減量 (0.4%)

        let currentPercent = 0;

        if (userAns <= 50) {
            // 【答えたものが0〜50%の場合】ゲージがいったん無くなった(0%)後、増えていく
            currentPercent = 0;
            gaugeBar.style.width = '0%';

            const timer = setInterval(() => {
                currentPercent += step;
                if (currentPercent >= correctAns) {
                    currentPercent = correctAns;
                    clearInterval(timer);
                    endAnim();
                }
                gaugeBar.style.width = currentPercent + '%';
            }, intervalMs);

        } else {
            // 【答えたものが100〜50%の場合】ゲージが満タン(100%)のまま、減っていく
            currentPercent = 100;
            gaugeBar.style.width = '100%';

            const timer = setInterval(() => {
                currentPercent -= step;
                if (currentPercent <= correctAns) {
                    currentPercent = correctAns;
                    clearInterval(timer);
                    endAnim();
                }
                gaugeBar.style.width = currentPercent + '%';
            }, intervalMs);
        }

        function endAnim() {
            // 正解の位置に水色のラインを明示
            const correctLine = document.getElementById('correct-line');
            correctLine.style.left = correctAns + '%';
            correctLine.style.display = 'block';
            
            // 少しだけ余韻を残してから次のステップへ
            setTimeout(callback, 800);
        }
    }

    // スコア計算＆風船減少演出
    function handleScoreCalculation(userAns, correctAns) {
        const diff = Math.abs(userAns - correctAns);
        const msgEl = document.getElementById('result-message');

        if (diff === 0) {
            // ピッタリの場合：風船が10個増える
            balloonCount += 10;
            document.getElementById('balloon-num').innerText = balloonCount;
            msgEl.innerHTML = `<h2 style="color: #ff3377; font-size: 28px; text-shadow: 0 0 10px #fff;">🎯 ピッタリ！風船+10個ボーナス！</h2>`;
            showNextControls();
        } else {
            // 差分がある場合：風船がその数だけ減少する（シュシュシュとカウントダウン）
            msgEl.innerHTML = `<h2 style="color: #2c3e50; font-size: 24px; text-shadow: 0 0 5px #fff;">正解は ${correctAns}% （誤差: -${diff}）</h2>`;
            
            let count = 0;
            const countdownTimer = setInterval(() => {
                if (count < diff && balloonCount > 0) {
                    balloonCount--;
                    document.getElementById('balloon-num').innerText = balloonCount;
                    count++;
                } else {
                    clearInterval(countdownTimer);
                    
                    // ゲームオーバー判定
                    if (balloonCount <= 0) {
                        setTimeout(() => { endGame(false); }, 1000);
                    } else {
                        showNextControls();
                    }
                }
            }, 30); // 30msごとに1個ずつ減らす
        }
    }

    // 「次の問題へ」または「結果表示」の制御
    function showNextControls() {
        document.getElementById('submit-btn').style.display = 'none';
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'inline-block';
        
        if (currentQIndex + 1 >= totalRounds) {
            nextBtn.innerText = "最終結果を見る";
        } else {
            nextBtn.innerText = "次の問題へ";
        }
    }

    // 次の問題に進む
    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex >= totalRounds) {
            endGame(true); // 全問クリア
        } else {
            loadQuestion();
        }
    }

    // ゲーム終了（クリア or オーバー）
    function endGame(isClear) {
        document.getElementById('game-screen').style.display = 'none';
        
        const resultScreen = document.getElementById('result-screen');
        const titleEl = document.getElementById('result-title');
        const descEl = document.getElementById('result-desc');
        
        resultScreen.style.display = 'block';

        if (isClear) {
            titleEl.innerText = "🎉 GAME CLEAR!";
            titleEl.style.color = "var(--success-color)";
            descEl.innerText = `おめでとうございます！\n設定された ${totalRounds} 問をすべてクリアしました。\n\n残った風船の数: ${balloonCount} 個`;
        } else {
            titleEl.innerText = "💥 GAME OVER";
            titleEl.style.color = "var(--danger-color)";
            descEl.innerText = `残念！風船がすべて割れてしまいました。\n\n到達ステージ: 第 ${currentQIndex + 1} 問目`;
        }
    }
</script>
</body>
</html>
