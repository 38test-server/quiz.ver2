<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーセントバルーン クイズ問題制作ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --danger-color: #e24a4a;
            --success-color: #2ecc71;
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --text-sub: #666;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            color: #2c3e50;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: #7f8c8d; }
        .btn-warning { background-color: #f39c12; color: white; }

        .image-preview {
            max-width: 200px;
            max-height: 150px;
            margin-top: 10px;
            display: block;
            border-radius: 4px;
        }

        .bg-thumb-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .bg-thumb {
            position: relative;
            width: 120px;
            height: 67.5px; /* 16:9 */
            border: 2px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .bg-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bg-thumb .delete-bg {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 10px;
            line-height: 20px;
            text-align: center;
            padding: 0;
        }

        .question-list {
            list-style: none;
            padding: 0;
        }

        .question-item {
            background: #f9f9f9;
            padding: 15px;
            border-left: 5px solid var(--primary-color);
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-info {
            flex-grow: 1;
        }

        .question-actions {
            display: flex;
            gap: 5px;
        }

        .file-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .auth-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-online { background: #27ae60; color: #fff; }
        .status-offline { background: #e24a4a; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 パーセントバルーン クイズ問題制作ツール</h1>
    <hr style="margin-bottom: 20px;">

    <div class="card">
        <h2>☁️ クラウド同期・アカウントログイン (Supabase)</h2>
        <div id="authContainer"></div>
    </div>

    <div class="card">
        <h2>💾 データの保存・読み込み（共同制作対応）</h2>
        <p style="font-size: 0.9em; color: #666;">
            ※JSON/ZIPファイルをインポートする際、既存の問題文と完全に一致するもの、および既に存在する全体背景画像は上書きされず、新要素のみが追記されます。
        </p>
        <div class="file-actions">
            <button class="btn btn-success" onclick="exportData('zip')">ZIP形式でエクスポート</button>
            <button class="btn btn-secondary" onclick="exportData('json')">JSON単体でダウンロード</button>
            <input type="file" id="importFile" accept=".json,.zip" style="display:none;" onchange="importData(this)">
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">ZIP / JSONを読み込み (追加マージ)</button>
            <button class="btn btn-secondary" onclick="fetchQuestionsFromSupabase(true)">🔄 クラウドから問題再読み込み</button>
            <button class="btn btn-warning" onclick="migrateBase64ToStorage()">☁️ 既存Base64画像をStorageへ移行</button>
        </div>
    </div>

    <div class="grid">
        <div>
            <div class="card">
                <h2>🖼️ 全体共有の背景画像設定 (16:9推奨)</h2>
                <div class="form-group">
                    <label>背景画像を追加（複数登録可 / なければ問題毎のものが優先）</label>
                    <input type="file" id="globalBgInput" accept="image/*" multiple onchange="handleGlobalBg(this)">
                </div>
                <div class="bg-thumb-container" id="globalBgThumbs"></div>
            </div>

            <div class="card">
                <h2 id="formTitle">📝 問題の新規登録</h2>
                <form id="quizForm" onsubmit="saveQuestion(event)">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="form-group">
                        <label for="questionText">問題文 <span style="color:red;">*必須</span></label>
                        <input type="text" id="questionText" required placeholder="例：日本人のうち、スマートフォンを使っている人の割合は？">
                    </div>

                    <div class="form-group">
                        <label for="answerValue">正解 (%) <span style="color:red;">*必須</span></label>
                        <input type="number" id="answerValue" required min="0" max="100" placeholder="0 ～ 100">
                    </div>

                    <div class="form-group">
                        <label for="qImageInput">イメージ画像 (最大横幅600pxに自動縮小)</label>
                        <input type="file" id="qImageInput" accept="image/*" onchange="previewImage(this, 'qImagePreview')">
                        <img id="qImagePreview" class="image-preview" style="display:none;">
                        <button type="button" class="btn btn-danger btn-secondary" id="clearQImg" style="display:none; margin-top:5px; padding:2px 5px; font-size:12px;" onclick="clearImage('qImageInput', 'qImagePreview', 'clearQImg')">画像を削除</button>
                    </div>

                    <div class="form-group">
                        <label for="bgImageInput">この問題専用の背景画像 (HD以上は等倍 / 16:9)</label>
                        <input type="file" id="bgImageInput" accept="image/*" onchange="previewImage(this, 'bgImagePreview', false)">
                        <img id="bgImagePreview" class="image-preview" style="display:none;">
                        <button type="button" class="btn btn-danger btn-secondary" id="clearBgImg" style="display:none; margin-top:5px; padding:2px 5px; font-size:12px;" onclick="clearImage('bgImageInput', 'bgImagePreview', 'clearBgImg')">画像を削除</button>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">登録する</button>
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="resetForm()">編集をキャンセル</button>
                </form>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>📋 登録済み問題一覧 (<span id="qCount">0</span>問)</h2>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="text" id="searchQuery" placeholder="🔍 問題文や解答で検索..." oninput="renderQuestions()">
                </div>
                <ul class="question-list" id="questionList"></ul>
            </div>
        </div>
    </div>
</div>

<script>
     // --- Supabaseの設定 ---
    const SUPABASE_URL = 'https://wfddewnonkwxwlaihamn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_RFILYcq2R5yx72AMhsh0JQ_Bfk1eZHA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STORAGE_BUCKET = 'balloon_images';
    const QUIZ_DATA_ROW_ID = 'main_quiz_data';

    // データ構造
    let quizData = {
        globalBackgrounds: [],
        questions: []
    };

    // 差分検知用スナップショット
    let questionsSnapshot = new Map();
    let globalBgSnapshot = new Set();

    // 編集時の一時画像データ（URLまたはBase64）
    let currentQImageVal = null;
    let currentBgImageVal = null;

    // 認証ユーザー状態
    let currentUser = null;
    let isUserAdmin = false;

    // --- Utility: Base64 -> Blob 変換 ---
    function base64ToBlob(base64Data) {
        try {
            const parts = base64Data.split(';base64,');
            const contentType = parts[0].split(':')[1];
            const raw = window.atob(parts[1]);
            const rawLength = raw.length;
            const uInt8Array = new Uint8Array(rawLength);
            for (let i = 0; i < rawLength; ++i) {
                uInt8Array[i] = raw.charCodeAt(i);
            }
            return new Blob([uInt8Array], { type: contentType });
        } catch (e) {
            console.error("Blob変換エラー:", e);
            return null;
        }
    }

    // --- Supabase Storage アップロード関数 ---
    async function uploadBase64ToStorage(base64Data, folder = 'general') {
        if (!base64Data || !base64Data.startsWith('data:image')) return base64Data;
        const blob = base64ToBlob(base64Data);
        if (!blob) return base64Data;

        const ext = blob.type.split('/')[1] || 'png';
        const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;

        const { data, error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(fileName, blob, {
            contentType: blob.type,
            upsert: true
        });

        if (error) {
            console.error('Storage Upload Error:', error);
            throw error;
        }

        const { data: publicUrlData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
        return publicUrlData.publicUrl;
    }

    // 管理者判定関数
    async function checkIsAdmin(user) {
        if (!user) return false;
        try {
            const { data, error } = await supabaseClient
                .from('admin_users')
                .select('user_id, email')
                .or(`user_id.eq.${user.id},email.eq.${user.email}`);

            if (error) {
                console.error('管理者判定エラー:', error);
                return false;
            }

            return data && data.length > 0;
        } catch (err) {
            console.error(err);
            return false;
        }
    }

    // 初期化
    window.onload = async function() {
        loadFromLocalStorage();
        renderGlobalBackgrounds();
        renderQuestions();
        await checkLoginStatus();
    };

    // --- Supabase 認証関連 ---
    async function checkLoginStatus() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        currentUser = user;
        if (currentUser) {
            isUserAdmin = await checkIsAdmin(currentUser);
            await fetchQuestionsFromSupabase();
        } else {
            isUserAdmin = false;
        }
        renderAuthUI();
        renderQuestions();
    }

    function renderAuthUI() {
        const container = document.getElementById('authContainer');
        if (!container) return;

        if (currentUser) {
            container.innerHTML = `
                <div class="auth-badge status-online">🟢 ログイン中 (${escapeHtml(currentUser.email)}${isUserAdmin ? ' / 管理者' : ''})</div>
                <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:10px;">クラウド同期が有効です。問題の閲覧・追加・編集が可能です。</p>
                <button class="btn btn-secondary" onclick="logoutFromSupabase()">ログアウト</button>
            `;
        } else {
            container.innerHTML = `
                <div class="auth-badge status-offline">⚪ オフライン (ローカルのみ)</div>
                <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:10px;">クラウドに問題を保存・同期するにはログインが必要です。</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
                    <input type="email" id="authEmail" placeholder="メールアドレス" style="flex:1; min-width:200px;">
                    <input type="password" id="authPassword" placeholder="パスワード" style="flex:1; min-width:150px;">
                </div>
                <button class="btn" onclick="loginToSupabase()">ログインして同期</button>
            `;
        }
    }

    async function loginToSupabase() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        if (!email || !password) {
            alert("メールアドレスとパスワードを入力してください。");
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email, password
        });

        if (error) {
            alert("ログインに失敗しました: " + error.message);
        } else {
            currentUser = data.user;
            isUserAdmin = await checkIsAdmin(currentUser);
            alert("ログインに成功しました。");
            renderAuthUI();
            await fetchQuestionsFromSupabase();
            renderQuestions();
        }
    }

    async function logoutFromSupabase() {
        await supabaseClient.auth.signOut();
        currentUser = null;
        isUserAdmin = false;
        alert("ログアウトしました。");
        renderAuthUI();
        renderQuestions();
    }

    // --- Supabase データ同期処理 ---
    async function fetchQuestionsFromSupabase(isManual = false) {
        if (!currentUser) {
            if (isManual) alert("ログインが必要です。");
            return;
        }

        try {
            const { data, error } = await supabaseClient
                .from('quiz_data')
                .select('percent_balloon')
                .eq('id', QUIZ_DATA_ROW_ID)
                .single();

            if (error && error.code !== 'PGRST116') {
                console.error("Supabase読み込みエラー:", error);
                if (isManual) alert("データの取得に失敗しました: " + error.message);
                return;
            }

            if (data) {
                const cloudData = data.percent_balloon;
                if (cloudData) {
                    quizData = typeof cloudData === 'string' ? JSON.parse(cloudData) : cloudData;
                    if (!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
                    if (!quizData.questions) quizData.questions = [];

                    updateSnapshots();
                    saveToLocalStorage();
                    renderGlobalBackgrounds();
                    renderQuestions();
                    if (isManual) alert("クラウドから最新の問題を取得しました。");
                } else {
                    if (isManual) alert("クラウドに保存された問題はありませんでした。");
                }
            }
        } catch (e) {
            console.error(e);
        }
    }

    function updateSnapshots() {
        questionsSnapshot.clear();
        quizData.questions.forEach(q => {
            if (q.id) questionsSnapshot.set(q.id, JSON.stringify(q));
        });
        globalBgSnapshot = new Set(quizData.globalBackgrounds || []);
    }

    async function syncAllToSupabase() {
        if (!currentUser) return true;

        try {
            const { data: remoteData } = await supabaseClient
                .from('quiz_data')
                .select('percent_balloon')
                .eq('id', QUIZ_DATA_ROW_ID)
                .single();

            let cloudQuizData = { globalBackgrounds: [], questions: [] };
            if (remoteData && remoteData.percent_balloon) {
                cloudQuizData = typeof remoteData.percent_balloon === 'string' ? JSON.parse(remoteData.percent_balloon) : remoteData.percent_balloon;
            }

            let cloudQuestions = cloudQuizData.questions || [];
            let cloudGlobalBg = cloudQuizData.globalBackgrounds || [];

            const localQuestionsMap = new Map();
            quizData.questions.forEach(q => {
                if (q.id) localQuestionsMap.set(q.id, q);
            });

            const mergedQuestionsMap = new Map();

            cloudQuestions.forEach(cq => {
                if (!cq.id) return;
                const cqId = cq.id;

                if (localQuestionsMap.has(cqId)) {
                    const localQ = localQuestionsMap.get(cqId);
                    const snapshotStr = questionsSnapshot.get(cqId);
                    const localStr = JSON.stringify(localQ);

                    if (snapshotStr && localStr !== snapshotStr) {
                        mergedQuestionsMap.set(cqId, localQ);
                    } else {
                        mergedQuestionsMap.set(cqId, cq);
                    }
                } else {
                    if (!questionsSnapshot.has(cqId)) {
                        mergedQuestionsMap.set(cqId, cq);
                    }
                }
            });

            quizData.questions.forEach(lq => {
                if (lq.id && !mergedQuestionsMap.has(lq.id)) {
                    if (!questionsSnapshot.has(lq.id)) {
                        mergedQuestionsMap.set(lq.id, lq);
                    }
                }
            });

            const mergedQuestions = Array.from(mergedQuestionsMap.values());

            const mergedBgSet = new Set(cloudGlobalBg);
            quizData.globalBackgrounds.forEach(bg => mergedBgSet.add(bg));
            globalBgSnapshot.forEach(bg => {
                if (!quizData.globalBackgrounds.includes(bg)) {
                    mergedBgSet.delete(bg);
                }
            });
            const mergedGlobalBg = Array.from(mergedBgSet);

            const payload = {
                globalBackgrounds: mergedGlobalBg,
                questions: mergedQuestions
            };

            const { error } = await supabaseClient
                .from('quiz_data')
                .upsert({
                    id: QUIZ_DATA_ROW_ID,
                    percent_balloon: payload,
                    created_by: currentUser.id
                }, { onConflict: 'id' });

            if (error) {
                alert("クラウドへの保存に失敗しました: " + error.message);
                return false;
            }

            quizData.questions = mergedQuestions;
            quizData.globalBackgrounds = mergedGlobalBg;
            updateSnapshots();

            saveToLocalStorage();
            renderGlobalBackgrounds();
            renderQuestions();

            return true;

        } catch (e) {
            console.error("マージ保存エラー:", e);
            alert("保存処理中にエラーが発生しました。");
            return false;
        }
    }

    function loadFromLocalStorage() {
        const localData = localStorage.getItem('balloon_quiz_data');
        if (localData) {
            try {
                quizData = JSON.parse(localData);
                if(!quizData.globalBackgrounds) quizData.globalBackgrounds = [];
                if(!quizData.questions) quizData.questions = [];
            } catch (e) {
                console.error("データ読み込み失敗", e);
            }
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('balloon_quiz_data', JSON.stringify(quizData));
        document.getElementById('qCount').innerText = quizData.questions.length;
    }

    // 画像プレビュー処理
    function previewImage(input, previewId, resize = true) {
        const preview = document.getElementById(previewId);
        const clearBtn = document.getElementById(previewId === 'qImagePreview' ? 'clearQImg' : 'clearBgImg');
        const file = input.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                if (resize) {
                    const img = new Image();
                    img.onload = function() {
                        const maxWidth = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                        preview.src = compressedBase64;
                        preview.style.display = 'block';
                        clearBtn.style.display = 'inline-block';
                        if(previewId === 'qImagePreview') currentQImageVal = compressedBase64;
                    };
                    img.src = e.target.result;
                } else {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    clearBtn.style.display = 'inline-block';
                    if(previewId === 'bgImagePreview') currentBgImageVal = e.target.result;
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function clearImage(inputId, previewId, btnId) {
        document.getElementById(inputId).value = "";
        document.getElementById(previewId).src = "";
        document.getElementById(previewId).style.display = "none";
        document.getElementById(btnId).style.display = "none";
        if(previewId === 'qImagePreview') currentQImageVal = null;
        if(previewId === 'bgImagePreview') currentBgImageVal = null;
    }

    // 全体背景画像の追加処理（Storageへアップロード）
    async function handleGlobalBg(input) {
        const files = input.files;
        if (!files.length) return;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const img = new Image();
                img.onload = async function() {
                    const maxWidth = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.80);
                    try {
                        const url = await uploadBase64ToStorage(compressedBase64, 'global_bg');
                        if (!quizData.globalBackgrounds.includes(url)) {
                            quizData.globalBackgrounds.push(url);
                        }
                        if (i === files.length - 1) {
                            input.value = '';
                            await syncAllToSupabase();
                        }
                    } catch (err) {
                        alert("背景画像のアップロードに失敗しました。");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function renderGlobalBackgrounds() {
        const container = document.getElementById('globalBgThumbs');
        container.innerHTML = '';
        quizData.globalBackgrounds.forEach((bg, index) => {
            const div = document.createElement('div');
            div.className = 'bg-thumb';
            div.innerHTML = `
                <img src="${bg}">
                <button class="delete-bg" onclick="deleteGlobalBg(${index})">✕</button>
            `;
            container.appendChild(div);
        });
    }

    async function deleteGlobalBg(index) {
        if(confirm("この全体背景画像を削除しますか？")) {
            quizData.globalBackgrounds.splice(index, 1);
            await syncAllToSupabase();
        }
    }

    // 問題の保存（新規・編集）
    async function saveQuestion(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "保存中...";

        try {
            const index = parseInt(document.getElementById('editIndex').value);
            const questionText = document.getElementById('questionText').value.trim();
            const answerValue = parseInt(document.getElementById('answerValue').value);

            const existingItem = (index !== -1) ? quizData.questions[index] : {};

            let finalQImg = currentQImageVal;
            if (finalQImg && finalQImg.startsWith('data:image')) {
                finalQImg = await uploadBase64ToStorage(finalQImg, 'questions');
            }

            let finalBgImg = currentBgImageVal;
            if (finalBgImg && finalBgImg.startsWith('data:image')) {
                finalBgImg = await uploadBase64ToStorage(finalBgImg, 'backgrounds');
            }

            const questionItem = {
                id: existingItem.id || 'balloon_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                question: questionText,
                answer: answerValue,
                image: finalQImg,
                background: finalBgImg,
                created_by: existingItem.created_by || (currentUser ? currentUser.id : null)
            };

            if (index === -1) {
                quizData.questions.push(questionItem);
            } else {
                quizData.questions[index] = questionItem;
            }

            const success = await syncAllToSupabase();
            if (success) {
                resetForm();
            }
        } catch (err) {
            console.error(err);
            alert("保存中にエラーが発生しました。");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = document.getElementById('editIndex').value === "-1" ? "登録する" : "更新する";
        }
    }

    function renderQuestions() {
        const list = document.getElementById('questionList');
        list.innerHTML = '';
        document.getElementById('qCount').innerText = quizData.questions.length;

        const searchInput = document.getElementById('searchQuery');
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';

        quizData.questions.forEach((q, index) => {
            if (query !== '') {
                const matchText = q.question.toLowerCase().includes(query);
                const matchAns = String(q.answer).includes(query);
                if (!matchText && !matchAns) return;
            }

            const canDelete = currentUser && (
                isUserAdmin ||
                (q.created_by && q.created_by === currentUser.id)
            );

            const li = document.createElement('li');
            li.className = 'question-item';
            li.innerHTML = `
                <div class="question-info">
                    <strong>Q.${index + 1}: ${escapeHtml(q.question)}</strong><br>
                    <span style="color: #e67e22; font-weight:bold;">正解: ${q.answer}%</span> 
                    ${q.image ? '🖼️画像有' : ''} ${q.background ? '🌌個別背景有' : ''}
                </div>
                <div class="question-actions">
                    <button class="btn" id="editBtn-${index}" onclick="editQuestion(${index})">編集</button>
                    ${canDelete ? `
                        <button class="btn btn-danger" onclick="deleteQuestion(${index})">削除</button>
                    ` : ''}
                </div>
            `;
            list.appendChild(li);
        });
    }

    function editQuestion(index) {
        const q = quizData.questions[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('questionText').value = q.question;
        document.getElementById('answerValue').value = q.answer;
        
        if (q.image) {
            document.getElementById('qImagePreview').src = q.image;
            document.getElementById('qImagePreview').style.display = 'block';
            document.getElementById('clearQImg').style.display = 'inline-block';
            currentQImageVal = q.image;
        } else {
            clearImage('qImageInput', 'qImagePreview', 'clearQImg');
        }

        if (q.background) {
            document.getElementById('bgImagePreview').src = q.background;
            document.getElementById('bgImagePreview').style.display = 'block';
            document.getElementById('clearBgImg').style.display = 'inline-block';
            currentBgImageVal = q.background;
        } else {
            clearImage('bgImageInput', 'bgImagePreview', 'clearBgImg');
        }

        document.getElementById('formTitle').innerText = `📝 問題の編集 (No.${index + 1})`;
        document.getElementById('submitBtn').innerText = "更新する";
        document.getElementById('cancelEditBtn').style.display = "inline-block";
        window.scrollTo({top: document.getElementById('quizForm').offsetTop, behavior: 'smooth'});
    }

    async function deleteQuestion(index) {
        if (confirm(`問題 No.${index + 1} を削除しますか？`)) {
            quizData.questions.splice(index, 1);
            const success = await syncAllToSupabase();
            if (!success) return;
            resetForm();
        }
    }

    function resetForm() {
        document.getElementById('editIndex').value = "-1";
        document.getElementById('quizForm').reset();
        clearImage('qImageInput', 'qImagePreview', 'clearQImg');
        clearImage('bgImageInput', 'bgImagePreview', 'clearBgImg');
        document.getElementById('formTitle').innerText = "📝 問題の新規登録";
        document.getElementById('submitBtn').innerText = "登録する";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    // --- エクスポート処理 (JSON / ZIP) ---
    async function exportData(type) {
        if (quizData.questions.length === 0 && quizData.globalBackgrounds.length === 0) {
            alert("エクスポートするデータがありません。");
            return;
        }

        if (type === 'json') {
            const dataStr = JSON.stringify(quizData, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `balloon_quiz_data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        } else if (type === 'zip') {
            const zip = new JSZip();
            const imgFolder = zip.folder("images");
            const exportQuizData = JSON.parse(JSON.stringify(quizData));

            let imgCount = 0;

            // 全体背景の処理
            for (let i = 0; i < exportQuizData.globalBackgrounds.length; i++) {
                const bg = exportQuizData.globalBackgrounds[i];
                if (bg && bg.startsWith('data:image')) {
                    const blob = base64ToBlob(bg);
                    if (blob) {
                        const ext = blob.type.split('/')[1] || 'png';
                        const fileName = `global_bg_${i}_${Date.now()}.${ext}`;
                        imgFolder.file(fileName, blob);
                        exportQuizData.globalBackgrounds[i] = `images/${fileName}`;
                        imgCount++;
                    }
                }
            }

            // 各問題画像の処理
            for (let i = 0; i < exportQuizData.questions.length; i++) {
                const q = exportQuizData.questions[i];
                if (q.image && q.image.startsWith('data:image')) {
                    const blob = base64ToBlob(q.image);
                    if (blob) {
                        const ext = blob.type.split('/')[1] || 'png';
                        const fileName = `q_${i}_img_${Date.now()}.${ext}`;
                        imgFolder.file(fileName, blob);
                        q.image = `images/${fileName}`;
                        imgCount++;
                    }
                }
                if (q.background && q.background.startsWith('data:image')) {
                    const blob = base64ToBlob(q.background);
                    if (blob) {
                        const ext = blob.type.split('/')[1] || 'png';
                        const fileName = `q_${i}_bg_${Date.now()}.${ext}`;
                        imgFolder.file(fileName, blob);
                        q.background = `images/${fileName}`;
                        imgCount++;
                    }
                }
            }

            zip.file("quiz_data.json", JSON.stringify(exportQuizData, null, 2));

            const content = await zip.generateAsync({type: "blob"});
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = `balloon_quiz_data_${new Date().toISOString().slice(0,10)}.zip`;
            a.click();
            URL.revokeObjectURL(url);
        }
    }

    // --- インポート処理 (JSON / ZIP) ---
    async function importData(input) {
        const file = input.files[0];
        if (!file) return;

        try {
            let imported = null;

            if (file.name.endsWith('.json')) {
                const text = await file.text();
                imported = JSON.parse(text);
            } else if (file.name.endsWith('.zip')) {
                const zip = await JSZip.loadAsync(file);
                const jsonFile = zip.file("quiz_data.json");
                if (!jsonFile) {
                    alert("ZIP内に quiz_data.json が存在しません。");
                    return;
                }
                const jsonText = await jsonFile.async("text");
                imported = JSON.parse(jsonText);

                // ZIP内の相対パス画像を Base64 に展開
                if (imported.globalBackgrounds && Array.isArray(imported.globalBackgrounds)) {
                    for (let i = 0; i < imported.globalBackgrounds.length; i++) {
                        const path = imported.globalBackgrounds[i];
                        if (path && path.startsWith('images/')) {
                            const zipImg = zip.file(path);
                            if (zipImg) {
                                const base64 = await zipImg.async("base64");
                                const ext = path.split('.').pop();
                                const mime = ext === 'jpg' ? 'jpeg' : ext;
                                imported.globalBackgrounds[i] = `data:image/${mime};base64,${base64}`;
                            }
                        }
                    }
                }

                if (imported.questions && Array.isArray(imported.questions)) {
                    for (let i = 0; i < imported.questions.length; i++) {
                        const q = imported.questions[i];
                        if (q.image && q.image.startsWith('images/')) {
                            const zipImg = zip.file(q.image);
                            if (zipImg) {
                                const base64 = await zipImg.async("base64");
                                const ext = q.image.split('.').pop();
                                const mime = ext === 'jpg' ? 'jpeg' : ext;
                                q.image = `data:image/${mime};base64,${base64}`;
                            }
                        }
                        if (q.background && q.background.startsWith('images/')) {
                            const zipImg = zip.file(q.background);
                            if (zipImg) {
                                const base64 = await zipImg.async("base64");
                                const ext = q.background.split('.').pop();
                                const mime = ext === 'jpg' ? 'jpeg' : ext;
                                q.background = `data:image/${mime};base64,${base64}`;
                            }
                        }
                    }
                }
            }

            if (!imported) return;

            let addedQuestions = 0;
            let addedBgs = 0;

            if (imported.globalBackgrounds && Array.isArray(imported.globalBackgrounds)) {
                imported.globalBackgrounds.forEach(bg => {
                    if (!quizData.globalBackgrounds.includes(bg)) {
                        quizData.globalBackgrounds.push(bg);
                        addedBgs++;
                    }
                });
            }

            if (imported.questions && Array.isArray(imported.questions)) {
                imported.questions.forEach(item => {
                    const isDuplicate = quizData.questions.some(q => q.question === item.question);
                    if (!isDuplicate) {
                        if (!item.id) {
                            item.id = 'balloon_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        }
                        quizData.questions.push({
                            ...item,
                            created_by: currentUser ? currentUser.id : null
                        });
                        addedQuestions++;
                    }
                });
            }

            await syncAllToSupabase();
            
            alert(`インポートが完了しました！\n・新しく追加された問題: ${addedQuestions}件\n・新しく追加された共通背景: ${addedBgs}件\n(既存の要素は保持されました)`);
            input.value = '';
        } catch (err) {
            alert("ファイルの読み込み・解析に失敗しました。");
            console.error(err);
        }
    }

    // --- 既存Base64画像をSupabase Storageへ一括移行 ---
    async function migrateBase64ToStorage() {
        if (!currentUser) {
            alert("Base64画像をStorageへ一括アップロードするにはログインが必要です。");
            return;
        }

        if (!confirm("既存のBase64画像データをすべてSupabase Storageへアップロードし、URL管理に置き換えますか？\n（データ量によっては時間がかかる場合があります）")) {
            return;
        }

        let migratedCount = 0;

        try {
            // 全体背景の移行
            for (let i = 0; i < quizData.globalBackgrounds.length; i++) {
                const bg = quizData.globalBackgrounds[i];
                if (bg && bg.startsWith('data:image')) {
                    const url = await uploadBase64ToStorage(bg, 'global_bg');
                    quizData.globalBackgrounds[i] = url;
                    migratedCount++;
                }
            }

            // 問題画像の移行
            for (let i = 0; i < quizData.questions.length; i++) {
                const q = quizData.questions[i];
                if (q.image && q.image.startsWith('data:image')) {
                    const url = await uploadBase64ToStorage(q.image, 'questions');
                    q.image = url;
                    migratedCount++;
                }
                if (q.background && q.background.startsWith('data:image')) {
                    const url = await uploadBase64ToStorage(q.background, 'backgrounds');
                    q.background = url;
                    migratedCount++;
                }
            }

            if (migratedCount > 0) {
                await syncAllToSupabase();
                alert(`移行が完了しました！ ${migratedCount} 件の画像が Storage にアップロードされました。`);
            } else {
                alert("移行対象となるBase64画像が見つかりませんでした（すでにURL化されています）。");
            }
        } catch (err) {
            console.error("一括移行エラー:", err);
            alert("移行処理中にエラーが発生しました。");
        }
    }

    // エスケープ処理
    function escapeHtml(str) {
        if(!str) return "";
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
</script>
