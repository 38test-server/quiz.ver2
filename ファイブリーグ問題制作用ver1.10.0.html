<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファイブリーグ 問題制作ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --primary-blue: #00b4d8;
            --primary-dark: #0077b6;
            --light-cyan: #e0f7fa;
            --accent-red: #ff4d6d;
            --accent-red-hover: #d90429;
            --text-color: #2b2d42;
            --border-color: #caf0f8;
            --shadow: 0 8px 20px rgba(0, 180, 216, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.3rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .form-group label .required {
            color: var(--accent-red);
            margin-left: 4px;
        }

        .form-group label .sub-text {
            font-size: 0.8rem;
            color: #666;
            font-weight: normal;
        }

        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        /* 5分割入力用のスタイル */
        .five-inputs-container {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .five-inputs-box {
            flex: 1;
            text-align: center;
        }

        .five-inputs-box span {
            display: block;
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 2px;
        }

        .five-inputs-box input {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 0;
        }

        .answer-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
        }

        .answer-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary-dark);
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkbox-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-accent {
            background-color: var(--accent-red);
            color: white;
        }

        .btn-accent:hover {
            background-color: var(--accent-red-hover);
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-danger {
            background-color: #e63946;
            color: white;
            padding: 5px 10px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: #c1121f;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .question-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-info h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 4px;
        }

        .question-info p {
            font-size: 0.9rem;
            color: #666;
        }

        .tag {
            display: inline-block;
            background-color: var(--light-cyan);
            color: var(--primary-dark);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            font-weight: bold;
        }

        .tag-difficulty {
            background-color: #fff3cd;
            color: #856404;
        }

        .image-preview {
            max-width: 150px;
            max-height: 100px;
            margin-top: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            display: none;
        }

        .bg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .bg-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .bg-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .bg-card-body {
            padding: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* 同期ステータス・認証バッジ */
        #syncStatus {
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .auth-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-online { background: #27ae60; color: #fff; }
        .status-offline { background: #a93226; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ファイブリーグ 問題制作ツール</h1>
        <p>クイズ問題データおよび背景画像の一括管理ツール（Supabase同期機能付き）</p>
        <div id="syncStatus">クラウドデータを取得中...</div>
    </header>

    <div class="card">
        <h2>☁️ クラウド同期・アカウントログイン (Supabase)</h2>
        <div id="authContainer"></div>
    </div>

    <div class="card">
        <h2>データ管理 (JSON)</h2>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="exportJSON()">JSONで出力（ダウンロード）</button>
            <label class="btn btn-accent" style="cursor: pointer; display: inline-block;">
                JSONを読み込み
                <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="uploadJSON(event)">
            </label>
            <button class="btn btn-secondary" onclick="fetchQuestionsFromSupabase(true)">🔄 クラウドから問題再読み込み</button>
            <button id="clearAllBtn" class="btn btn-danger" onclick="clearAllQuestions()" style="display: none;">問題データを全削除</button>
        </div>
    </div>

    <div class="card">
        <h2 id="formTitle">問題の追加</h2>

        <div class="form-group">
            <label for="difficulty">難易度 <span class="required">*必須</span></label>
            <select id="difficulty">
                <option value="1">LEVEL 1 (初級)</option>
                <option value="2">LEVEL 2 (中級)</option>
                <option value="3">LEVEL 3 (上級)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="questionText">問題文 <span class="required">*必須</span></label>
            <textarea id="questionText" rows="3" placeholder="例：日本の首都はどこ？"></textarea>
        </div>

        <div class="form-group">
            <label>解答 (主解答・ふりがな) <span class="required">*必須</span> <span class="sub-text">※主解答は各枠1文字。かな・英字・数字・記号はふりがなへ自動転記されます</span></label>
            <div class="answer-block">
                <div style="margin-bottom: 10px;">
                    <span style="font-size:0.85rem; font-weight:bold;">主解答 (表示用・漢字等可)</span>
                    <div class="five-inputs-container">
                        <div class="five-inputs-box"><span>1人目</span><input type="text" maxlength="1" class="main-ans-char" oncompositionend="handleCharInput(this, 'main', 0, 'main_furi')" onchange="handleCharInput(this, 'main', 0, 'main_furi')"></div>
                        <div class="five-inputs-box"><span>2人目</span><input type="text" maxlength="1" class="main-ans-char" oncompositionend="handleCharInput(this, 'main', 1, 'main_furi')" onchange="handleCharInput(this, 'main', 1, 'main_furi')"></div>
                        <div class="five-inputs-box"><span>3人目</span><input type="text" maxlength="1" class="main-ans-char" oncompositionend="handleCharInput(this, 'main', 2, 'main_furi')" onchange="handleCharInput(this, 'main', 2, 'main_furi')"></div>
                        <div class="five-inputs-box"><span>4人目</span><input type="text" maxlength="1" class="main-ans-char" oncompositionend="handleCharInput(this, 'main', 3, 'main_furi')" onchange="handleCharInput(this, 'main', 3, 'main_furi')"></div>
                        <div class="five-inputs-box"><span>5人目</span><input type="text" maxlength="1" class="main-ans-char" oncompositionend="handleCharInput(this, 'main', 4, 'main_furi')" onchange="handleCharInput(this, 'main', 4, 'main_furi')"></div>
                    </div>
                </div>
                <div>
                    <span style="font-size:0.85rem; font-weight:bold;">ふりがな (判定用・ひらがな/英字/数字/記号・2文字以上可)</span>
                    <div class="five-inputs-container">
                        <div class="five-inputs-box"><span>1人目</span><input type="text" class="main-furi-char" id="main_furi_0" onchange="handleFuriInput(this)"></div>
                        <div class="five-inputs-box"><span>2人目</span><input type="text" class="main-furi-char" id="main_furi_1" onchange="handleFuriInput(this)"></div>
                        <div class="five-inputs-box"><span>3人目</span><input type="text" class="main-furi-char" id="main_furi_2" onchange="handleFuriInput(this)"></div>
                        <div class="five-inputs-box"><span>4人目</span><input type="text" class="main-furi-char" id="main_furi_3" onchange="handleFuriInput(this)"></div>
                        <div class="five-inputs-box"><span>5人目</span><input type="text" class="main-furi-char" id="main_furi_4" onchange="handleFuriInput(this)"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>その他の回答 (別解) <span class="sub-text">※別解を追加した場合、主解答・ふりがな共に必須となります</span></label>
            <div id="altAnswersContainer"></div>
            <button type="button" class="btn btn-secondary btn-small" onclick="addAltAnswerBlock()">＋ 別解を追加</button>
        </div>

        <div class="form-group">
            <label>使用可能文字種 <span class="sub-text">※複数選択可</span></label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="charTypes" value="ひらがな" checked> ひらがな</label>
                <label><input type="checkbox" name="charTypes" value="カタカナ"> カタカナ</label>
                <label><input type="checkbox" name="charTypes" value="漢字"> 漢字</label>
                <label><input type="checkbox" name="charTypes" value="アルファベット"> アルファベット</label>
                <label><input type="checkbox" name="charTypes" value="数字"> 数字</label>
                <label><input type="checkbox" name="charTypes" value="記号"> 記号</label>
            </div>
        </div>

        <div class="form-group">
            <label for="preImage">回答前画像 (問題表示時)</label>
            <div class="file-input-wrapper">
                <input type="file" id="preImage" accept="image/*" onchange="previewImage(this, 'preImagePreview')">
                <button type="button" class="btn btn-secondary" onclick="clearImage('preImage', 'preImagePreview')">削除</button>
            </div>
            <img id="preImagePreview" class="image-preview" src="" alt="回答前画像プレビュー">
        </div>

        <div class="form-group">
            <label for="postImage">回答後画像 (結果表示時)</label>
            <div class="file-input-wrapper">
                <input type="file" id="postImage" accept="image/*" onchange="previewImage(this, 'postImagePreview')">
                <button type="button" class="btn btn-secondary" onclick="clearImage('postImage', 'postImagePreview')">削除</button>
            </div>
            <img id="postImagePreview" class="image-preview" src="" alt="回答後画像プレビュー">
        </div>

        <div class="btn-group">
            <button id="saveBtn" class="btn btn-primary" onclick="saveQuestion()">問題を追加</button>
            <button id="cancelBtn" class="btn btn-secondary" onclick="resetForm()" style="display:none;">キャンセル</button>
        </div>
    </div>

    <div class="card">
        <h2>背景画像の管理 <span id="bgImageCount" style="font-size: 1rem; color: #666; font-weight: normal;">0 枚</span></h2>
        <div class="form-group">
            <label for="bgFileInput">新しい背景画像を追加 (複数選択可)</label>
            <div class="file-input-wrapper">
                <input type="file" id="bgFileInput" accept="image/*" multiple onchange="addBgImage()">
            </div>
        </div>
        <div class="bg-grid" id="bgImageList"></div>
    </div>

    <div class="card">
        <h2>登録問題一覧 <span id="questionCount" style="font-size: 1rem; color: #666; font-weight: normal;">0 件</span></h2>
        <div id="questionList"></div>
    </div>
</div>

<script>
    // --- Supabase設定 ---
    const SUPABASE_URL = 'https://vnnuqbndesdemwacneqf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ozF0vXC-dHA_lp_tDWSKIw_MYPufRCc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 管理者メールアドレス
    const ADMIN_EMAIL = 's50251050@hiroshima-u.ed.jp';

    // レコード識別用ID
    const QUIZ_DATA_ROW_ID = 'main_quiz_data';

    let questions = [];
    let bgImages = [];
    let editingIndex = -1;
    let altAnswerCount = 0;
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', async () => {
        renderQuestionList();
        renderBgImageList();
        await checkLoginStatus();
    });

    // --- Supabase認証 関連 ---
    async function checkLoginStatus() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        currentUser = user;
        renderAuthUI();

        if (currentUser) {
            await fetchQuestionsFromSupabase();
        } else {
            document.getElementById('syncStatus').innerText = '⚪ オフライン（ローカル状態）';
        }
    }

    function renderAuthUI() {
        const container = document.getElementById('authContainer');
        const clearAllBtn = document.getElementById('clearAllBtn');
        if (!container) return;

        if (currentUser) {
            const isAdmin = currentUser.email === ADMIN_EMAIL;
            container.innerHTML = `
                <div class="auth-badge status-online">🟢 ログイン中 (${escapeHTML(currentUser.email)}${isAdmin ? ' / 管理者' : ''})</div>
                <p style="font-size:0.85rem; color:#666; margin-bottom:10px;">クラウド同期が有効です。問題の閲覧・追加・編集が可能です。</p>
                <button class="btn btn-secondary" onclick="logoutFromSupabase()">ログアウト</button>
            `;
            if (clearAllBtn) clearAllBtn.style.display = isAdmin ? 'inline-block' : 'none';
        } else {
            container.innerHTML = `
                <div class="auth-badge status-offline">⚪ オフライン (ローカルのみ)</div>
                <p style="font-size:0.85rem; color:#666; margin-bottom:10px;">クラウドに問題を保存・同期するにはログインが必要です。</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
                    <input type="email" id="authEmail" placeholder="メールアドレス" style="flex:1; min-width:200px;">
                    <input type="password" id="authPassword" placeholder="パスワード" style="flex:1; min-width:150px;">
                </div>
                <button class="btn btn-primary" onclick="loginToSupabase()">ログインして同期</button>
            `;
            if (clearAllBtn) clearAllBtn.style.display = 'none';
        }
    }

    async function loginToSupabase() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        if (!email || !password) {
            alert("メールアドレスとパスワードを入力してください。");
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email, password
        });

        if (error) {
            alert("ログインに失敗しました: " + error.message);
        } else {
            currentUser = data.user;
            alert("ログインに成功しました。");
            renderAuthUI();
            await fetchQuestionsFromSupabase();
        }
    }

    async function logoutFromSupabase() {
        await supabaseClient.auth.signOut();
        currentUser = null;
        alert("ログアウトしました。");
        renderAuthUI();
        renderQuestionList();
    }

    // Supabaseからデータ取得 (quiz_data テーブルの five_league カラム使用)
    async function fetchQuestionsFromSupabase(isManual = false) {
        const statusEl = document.getElementById('syncStatus');
        statusEl.innerText = '☁️ Supabaseからデータを読み込み中...';

        try {
            const { data, error } = await supabaseClient
                .from('quiz_data')
                .select('five_league')
                .eq('id', QUIZ_DATA_ROW_ID)
                .single();

            if (error && error.code !== 'PGRST116') {
                console.error('Fetch Error:', error);
                statusEl.innerText = '⚠️ クラウドデータの読み込みに失敗しました';
                if (isManual) alert("データの取得に失敗しました: " + error.message);
                return;
            }

            if (data && data.five_league) {
                questions = data.five_league.questions || [];
                bgImages = data.five_league.bgImages || [];
                statusEl.innerText = '🟢 クラウドと正常に同期されています';
                if (isManual) alert("クラウドから最新の問題を取得しました。");
            } else {
                questions = [];
                bgImages = [];
                statusEl.innerText = '🟢 新規データ（クラウド同期準備完了）';
                if (isManual) alert("クラウドに保存された問題はありませんでした。");
            }
            renderQuestionList();
            renderBgImageList();
        } catch (e) {
            console.error('Supabase load error:', e);
            statusEl.innerText = '⚠️ 通信エラーが発生しました';
        }
    }

    // Supabaseへデータ保存
    async function saveToSupabase() {
        if (!currentUser) return true;

        const statusEl = document.getElementById('syncStatus');
        statusEl.innerText = '☁️ クラウドへ保存中...';

        try {
            const payload = {
                questions: questions,
                bgImages: bgImages
            };

            const { error } = await supabaseClient
                .from('quiz_data')
                .upsert({
                    id: QUIZ_DATA_ROW_ID,
                    five_league: payload,
                    created_by: currentUser.id
                }, { onConflict: 'id' });

            if (error) {
                console.error('Supabase Save Error:', error);
                statusEl.innerText = '❌ クラウドへの保存に失敗しました';
                alert("クラウドへの保存に失敗しました: " + error.message);
                return false;
            } else {
                statusEl.innerText = '🟢 クラウドへ正常に保存されました！';
                return true;
            }
        } catch (e) {
            console.error('Supabase Save Exception:', e);
            statusEl.innerText = '❌ 保存中に例外が発生しました';
            return false;
        }
    }

    function toHalfWidth(str) {
        return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xfee0));
    }

    function kataToHira(str) {
        return str.replace(/[\u30a1-\u30f6]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0x60));
    }

    function isDirectPassChar(char) {
        if (!char) return false;
        const normalized = toHalfWidth(char);
        return /^[\u3041-\u3096\u30a1-\u30f6a-zA-Z0-9\u30fc\u3000-\u303f\u2000-\u206f\u25a0-\u25ff\u2600-\u26ff\uff00-\uffef!-~]+$/.test(normalized);
    }

    function isFuriganaValidStr(str) {
        if (!str) return false;
        const normalized = toHalfWidth(str);
        return /^[\u3041-\u3096a-zA-Z0-9\u30fc\u3000-\u303f\u2000-\u206f\u25a0-\u25ff\u2600-\u26ff\uff00-\uffef!-~]+$/.test(normalized);
    }

    function handleCharInput(inputEl, prefix, index, targetFuriPrefix) {
        let val = inputEl.value;
        if (!val) return;

        val = toHalfWidth(val);
        inputEl.value = val;

        if (val.length === 1) {
            const container = inputEl.closest('.five-inputs-container');
            const inputs = container.querySelectorAll('input');
            if (index < 4) {
                inputs[index + 1].focus();
            }
        }

        if (isDirectPassChar(val)) {
            const furiTarget = document.getElementById(`${targetFuriPrefix}_${index}`);
            if (furiTarget && !furiTarget.value) {
                furiTarget.value = kataToHira(val);
            }
        }
    }

    function handleFuriInput(inputEl) {
        let val = inputEl.value;
        if (!val) return;
        val = toHalfWidth(val);
        if (isDirectPassChar(val)) {
            val = kataToHira(val);
        }
        inputEl.value = val;
    }

    function addAltAnswerBlock(mainVal = ['', '', '', '', ''], furiVal = ['', '', '', '', '']) {
        const id = altAnswerCount++;
        const container = document.getElementById('altAnswersContainer');

        const block = document.createElement('div');
        block.className = 'answer-block';
        block.id = `alt_block_${id}`;

        block.innerHTML = `
            <div class="answer-block-header">
                <span>別解</span>
                <button type="button" class="btn btn-danger btn-small" onclick="removeAltAnswerBlock(${id})">削除</button>
            </div>
            <div style="margin-bottom: 10px;">
                <span style="font-size:0.85rem; font-weight:bold;">表記</span>
                <div class="five-inputs-container">
                    <div class="five-inputs-box"><span>1人目</span><input type="text" maxlength="1" class="alt-main-${id}" value="${mainVal[0]||''}" oncompositionend="handleCharInput(this, 'alt_${id}', 0, 'alt_furi_${id}')" onchange="handleCharInput(this, 'alt_${id}', 0, 'alt_furi_${id}')"></div>
                    <div class="five-inputs-box"><span>2人目</span><input type="text" maxlength="1" class="alt-main-${id}" value="${mainVal[1]||''}" oncompositionend="handleCharInput(this, 'alt_${id}', 1, 'alt_furi_${id}')" onchange="handleCharInput(this, 'alt_${id}', 1, 'alt_furi_${id}')"></div>
                    <div class="five-inputs-box"><span>3人目</span><input type="text" maxlength="1" class="alt-main-${id}" value="${mainVal[2]||''}" oncompositionend="handleCharInput(this, 'alt_${id}', 2, 'alt_furi_${id}')" onchange="handleCharInput(this, 'alt_${id}', 2, 'alt_furi_${id}')"></div>
                    <div class="five-inputs-box"><span>4人目</span><input type="text" maxlength="1" class="alt-main-${id}" value="${mainVal[3]||''}" oncompositionend="handleCharInput(this, 'alt_${id}', 3, 'alt_furi_${id}')" onchange="handleCharInput(this, 'alt_${id}', 3, 'alt_furi_${id}')"></div>
                    <div class="five-inputs-box"><span>5人目</span><input type="text" maxlength="1" class="alt-main-${id}" value="${mainVal[4]||''}" oncompositionend="handleCharInput(this, 'alt_${id}', 4, 'alt_furi_${id}')" onchange="handleCharInput(this, 'alt_${id}', 4, 'alt_furi_${id}')"></div>
                </div>
            </div>
            <div>
                <span style="font-size:0.85rem; font-weight:bold;">ふりがな</span>
                <div class="five-inputs-container">
                    <div class="five-inputs-box"><span>1人目</span><input type="text" class="alt-furi-${id}" id="alt_furi_${id}_0" value="${furiVal[0]||''}" onchange="handleFuriInput(this)"></div>
                    <div class="five-inputs-box"><span>2人目</span><input type="text" class="alt-furi-${id}" id="alt_furi_${id}_1" value="${furiVal[1]||''}" onchange="handleFuriInput(this)"></div>
                    <div class="five-inputs-box"><span>3人目</span><input type="text" class="alt-furi-${id}" id="alt_furi_${id}_2" value="${furiVal[2]||''}" onchange="handleFuriInput(this)"></div>
                    <div class="five-inputs-box"><span>4人目</span><input type="text" class="alt-furi-${id}" id="alt_furi_${id}_3" value="${furiVal[3]||''}" onchange="handleFuriInput(this)"></div>
                    <div class="five-inputs-box"><span>5人目</span><input type="text" class="alt-furi-${id}" id="alt_furi_${id}_4" value="${furiVal[4]||''}" onchange="handleFuriInput(this)"></div>
                </div>
            </div>
        `;

        container.appendChild(block);
    }

    function removeAltAnswerBlock(id) {
        const block = document.getElementById(`alt_block_${id}`);
        if (block) {
            block.remove();
        }
    }

    function get5CharsFromInputs(className) {
        const inputs = document.querySelectorAll(`.${className}`);
        let result = [];
        inputs.forEach(input => {
            result.push(input.value.trim());
        });
        return result;
    }

    async function saveQuestion() {
        const questionText = document.getElementById('questionText').value.trim();
        const difficulty = parseInt(document.getElementById('difficulty').value, 10) || 1;
        
        if (!questionText) {
            alert('問題文を入力してください。');
            return;
        }

        const mainChars = get5CharsFromInputs('main-ans-char');
        if (mainChars.some(c => c === '')) {
            alert('主解答（表示用）は5文字すべて入力してください。');
            return;
        }
        const mainAnswer = mainChars.join('');

        const furiChars = get5CharsFromInputs('main-furi-char');
        if (furiChars.some(c => c === '')) {
            alert('ふりがな（読み解答）は5枠すべて入力してください。');
            return;
        }
        
        for (let i = 0; i < 5; i++) {
            if (!isFuriganaValidStr(furiChars[i])) {
                alert(`主解答のふりがな ${i + 1}人目（${furiChars[i]}）は【ひらがな・アルファベット・数字・記号】のみ使用可能です。`);
                return;
            }
        }
        const furigana = furiChars; // 配列で保存して枠ごとの割り当て情報を保持

        const altBlocks = document.querySelectorAll('#altAnswersContainer .answer-block');
        let altAnswers = [];
        let altFuriganas = [];

        for (let block of altBlocks) {
            const id = block.id.replace('alt_block_', '');
            const aMainChars = get5CharsFromInputs(`alt-main-${id}`);
            const aFuriChars = get5CharsFromInputs(`alt-furi-${id}`);

            if (aMainChars.some(c => c === '')) {
                alert('追加された別解の表記枠をすべて埋めてください（5文字）。');
                return;
            }
            if (aFuriChars.some(c => c === '')) {
                alert('追加された別解のふりがな枠をすべて埋めてください。');
                return;
            }

            for (let i = 0; i < 5; i++) {
                if (!isFuriganaValidStr(aFuriChars[i])) {
                    alert(`別解ふりがな ${i + 1}人目（${aFuriChars[i]}）は【ひらがな・アルファベット・数字・記号】のみ使用可能です。`);
                    return;
                }
            }

            altAnswers.push(aMainChars.join(''));
            altFuriganas.push(aFuriChars);
        }

        const charTypeNodes = document.querySelectorAll('input[name="charTypes"]:checked');
        const charTypes = Array.from(charTypeNodes).map(node => node.value);

        const preImgPreview = document.getElementById('preImagePreview');
        const postImgPreview = document.getElementById('postImagePreview');

        const recordId = (editingIndex >= 0 && questions[editingIndex].id) 
            ? questions[editingIndex].id 
            : 'five_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

        const createdBy = (editingIndex >= 0 && questions[editingIndex].created_by) 
            ? questions[editingIndex].created_by 
            : (currentUser ? currentUser.id : null);

        const questionItem = {
            id: recordId,
            difficulty,
            questionText,
            mainAnswer,
            furigana,
            altAnswers,
            altFuriganas,
            charTypes,
            preImage: preImgPreview.src.startsWith('data:image') ? preImgPreview.src : '',
            postImage: postImgPreview.src.startsWith('data:image') ? postImgPreview.src : '',
            created_by: createdBy
        };

        if (editingIndex >= 0) {
            questions[editingIndex] = questionItem;
            editingIndex = -1;
        } else {
            questions.push(questionItem);
        }

        const success = await saveToSupabase();
        if (!success) return;

        renderQuestionList();
        resetForm();
    }

    function resetForm() {
        document.getElementById('questionText').value = '';
        document.getElementById('difficulty').value = '1';
        
        document.querySelectorAll('.main-ans-char').forEach(input => input.value = '');
        document.querySelectorAll('.main-furi-char').forEach(input => input.value = '');

        document.getElementById('altAnswersContainer').innerHTML = '';
        altAnswerCount = 0;
        
        const checkboxes = document.querySelectorAll('input[name="charTypes"]');
        checkboxes.forEach(cb => {
            cb.checked = (cb.value === 'ひらがな');
        });

        clearImage('preImage', 'preImagePreview');
        clearImage('postImage', 'postImagePreview');

        document.getElementById('formTitle').innerText = '問題の追加';
        document.getElementById('saveBtn').innerText = '問題を追加';
        document.getElementById('cancelBtn').style.display = 'none';
        editingIndex = -1;
    }

    function editQuestion(index) {
        resetForm();
        const q = questions[index];
        editingIndex = index;

        document.getElementById('questionText').value = q.questionText;
        document.getElementById('difficulty').value = (q.difficulty || 1).toString();

        const mainChars = (q.mainAnswer || '').split('');
        
        // 配列データと文字列データ両方の互換処理
        let furiChars = [];
        if (Array.isArray(q.furigana)) {
            furiChars = q.furigana;
        } else if (typeof q.furigana === 'string') {
            furiChars = q.furigana.split('');
        }
        
        document.querySelectorAll('.main-ans-char').forEach((input, i) => input.value = mainChars[i] || '');
        document.querySelectorAll('.main-furi-char').forEach((input, i) => input.value = furiChars[i] || '');

        if (q.altAnswers && q.altAnswers.length > 0) {
            q.altAnswers.forEach((alt, idx) => {
                const altMain = alt.split('');
                let altFuri = [];
                if (q.altFuriganas && q.altFuriganas[idx]) {
                    if (Array.isArray(q.altFuriganas[idx])) {
                        altFuri = q.altFuriganas[idx];
                    } else if (typeof q.altFuriganas[idx] === 'string') {
                        altFuri = q.altFuriganas[idx].split('');
                    }
                } else {
                    altFuri = altMain;
                }
                addAltAnswerBlock(altMain, altFuri);
            });
        }

        const checkboxes = document.querySelectorAll('input[name="charTypes"]');
        checkboxes.forEach(cb => {
            cb.checked = q.charTypes ? q.charTypes.includes(cb.value) : false;
        });

        if (q.preImage) {
            const preImgPreview = document.getElementById('preImagePreview');
            preImgPreview.src = q.preImage;
            preImgPreview.style.display = 'block';
        }

        if (q.postImage) {
            const postImgPreview = document.getElementById('postImagePreview');
            postImgPreview.src = q.postImage;
            postImgPreview.style.display = 'block';
        }

        document.getElementById('formTitle').innerText = `問題の編集 (第${index + 1}問)`;
        document.getElementById('saveBtn').innerText = '変更を保存';
        document.getElementById('cancelBtn').style.display = 'inline-block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuestionList() {
        const listEl = document.getElementById('questionList');
        const countEl = document.getElementById('questionCount');
        
        countEl.innerText = `${questions.length} 件`;

        if (questions.length === 0) {
            listEl.innerHTML = '<p style="color:#888; text-align:center; padding: 20px;">登録された問題はありません</p>';
            return;
        }

        listEl.innerHTML = '';

        questions.forEach((q, index) => {
            const item = document.createElement('div');
            item.className = 'question-item';

            const diffVal = q.difficulty || 1;
            const diffTag = `<span class="tag tag-difficulty">LEVEL ${diffVal}</span>`;

            const displayFuriganaStr = Array.isArray(q.furigana) ? q.furigana.join('') : q.furigana;
            const furiganaDisplay = displayFuriganaStr ? `<span class="tag" style="background:#e8f5e9; color:#2e7d32;">読み: ${escapeHTML(displayFuriganaStr)}</span>` : '<span class="tag" style="background:#ffebee; color:#c62828;">読み未設定</span>';

            const charTypesTags = (q.charTypes && q.charTypes.length > 0)
                ? q.charTypes.map(t => `<span class="tag">${t}</span>`).join('')
                : '<span class="tag">なし</span>';

            let altText = '';
            if (q.altAnswers && q.altAnswers.length > 0) {
                const combinedAlts = q.altAnswers.map((alt, i) => {
                    let fStr = '';
                    if (q.altFuriganas && q.altFuriganas[i]) {
                        fStr = Array.isArray(q.altFuriganas[i]) ? q.altFuriganas[i].join('') : q.altFuriganas[i];
                    }
                    const f = fStr ? `(${fStr})` : '';
                    return `${alt}${f}`;
                }).join(', ');
                altText = `<p><strong>別解:</strong> ${escapeHTML(combinedAlts)}</p>`;
            }

            const preBadge = q.preImage ? '<span class="tag" style="background:#fff3e0; color:#e65100;">回答前画像あり</span>' : '';
            const postBadge = q.postImage ? '<span class="tag" style="background:#f3e5f5; color:#7b1fa2;">回答後画像あり</span>' : '';

            // 削除ボタン権限判定（管理者または制作者本人のみ）
            const canDelete = currentUser && (
                currentUser.email === ADMIN_EMAIL ||
                (q.created_by && q.created_by === currentUser.id)
            );

            item.innerHTML = `
                <div class="question-info">
                    <h3>第 ${index + 1} 問: ${escapeHTML(q.questionText)}</h3>
                    <p><strong>難易度:</strong> ${diffTag}</p>
                    <p><strong>表示解答:</strong> ${escapeHTML(q.mainAnswer)} ${furiganaDisplay}</p>
                    ${altText}
                    <p style="margin-top: 4px;"><strong>文字種:</strong> ${charTypesTags} ${preBadge} ${postBadge}</p>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="editQuestion(${index})">編集</button>
                    ${canDelete ? `<button class="btn btn-danger" onclick="deleteQuestion(${index})">削除</button>` : ''}
                </div>
            `;

            listEl.appendChild(item);
        });
    }

    function previewImage(input, previewId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById(previewId);
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function clearImage(inputId, previewId) {
        document.getElementById(inputId).value = '';
        const img = document.getElementById(previewId);
        img.src = '';
        img.style.display = 'none';
    }

    function addBgImage() {
        const input = document.getElementById('bgFileInput');
        if (input.files && input.files[0]) {
            const files = Array.from(input.files);
            let loaded = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    bgImages.push({
                        name: file.name,
                        url: e.target.result
                    });
                    loaded++;
                    if (loaded === files.length) {
                        await saveToSupabase();
                        renderBgImageList();
                        input.value = '';
                    }
                };
                reader.readAsDataURL(file);
            });
        }
    }

    async function deleteBgImage(index) {
        if (confirm('この背景画像を削除しますか？')) {
            bgImages.splice(index, 1);
            await saveToSupabase();
            renderBgImageList();
        }
    }

    function renderBgImageList() {
        const listEl = document.getElementById('bgImageList');
        const countEl = document.getElementById('bgImageCount');
        
        countEl.innerText = `${bgImages.length} 枚`;

        if (bgImages.length === 0) {
            listEl.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align:center; padding: 15px;">登録された背景画像はありません（デフォルト背景が適用されます）</p>';
            return;
        }

        listEl.innerHTML = '';
        bgImages.forEach((bg, index) => {
            const card = document.createElement('div');
            card.className = 'bg-card';
            card.innerHTML = `
                <img src="${bg.url}" alt="${escapeHTML(bg.name)}">
                <div class="bg-card-body">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;" title="${escapeHTML(bg.name)}">${escapeHTML(bg.name)}</span>
                    <button class="btn btn-danger" onclick="deleteBgImage(${index})">削除</button>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    async function deleteQuestion(index) {
        const q = questions[index];
        const canDelete = currentUser && (
            currentUser.email === ADMIN_EMAIL ||
            (q.created_by && q.created_by === currentUser.id)
        );

        if (!canDelete) {
            alert('この問題を削除できるのは制作者本人または管理者のみです。');
            return;
        }

        if (confirm(`第 ${index + 1} 問を削除しますか？`)) {
            questions.splice(index, 1);
            const success = await saveToSupabase();
            if (!success) return;

            renderQuestionList();
            if (editingIndex === index) {
                resetForm();
            }
        }
    }

    async function clearAllQuestions() {
        // 管理者チェック
        if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
            alert('一括削除は管理者のみ可能です。');
            return;
        }

        if (!confirm('登録されているすべての問題を削除しますか？この操作は取り消せません。')) {
            return;
        }

        // 確認用パスワード入力
        const password = prompt('安全のため、管理者のログインパスワードを入力してください:');
        if (!password) {
            alert('削除をキャンセルしました。');
            return;
        }

        // パスワード認証による本人確認
        const { error } = await supabaseClient.auth.signInWithPassword({
            email: currentUser.email,
            password: password
        });

        if (error) {
            alert('パスワードが正しくありません。全削除を中止しました。');
            return;
        }

        // 認証成功時に全削除実行
        questions = [];
        const success = await saveToSupabase();
        if (success) {
            renderQuestionList();
            resetForm();
            alert('すべての問題データを削除しました。');
        }
    }

    function exportJSON() {
        if (questions.length === 0 && bgImages.length === 0) {
            alert('エクスポートするデータがありません。');
            return;
        }

        const exportData = {
            questions: questions,
            bgImages: bgImages
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `five_league_data_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function uploadJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                let importedQuestions = [];
                let importedBgImages = [];

                if (Array.isArray(imported)) {
                    importedQuestions = imported;
                } else if (typeof imported === 'object' && imported !== null) {
                    importedQuestions = imported.questions || [];
                    importedBgImages = imported.bgImages || [];
                }

                let bgUpdated = false;
                if (importedBgImages && Array.isArray(importedBgImages) && importedBgImages.length > 0) {
                    bgImages = importedBgImages;
                    bgUpdated = true;
                }

                let addedCount = 0;
                let duplicateCount = 0;

                importedQuestions.forEach(item => {
                    const isDuplicate = questions.some(existing => 
                        existing.questionText === item.questionText && 
                        existing.mainAnswer === item.mainAnswer
                    );

                    if (!isDuplicate) {
                        if (!item.difficulty) item.difficulty = 1;
                        if (!item.id) item.id = 'five_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        item.created_by = currentUser ? currentUser.id : null;
                        questions.push(item);
                        addedCount++;
                    } else {
                        duplicateCount++;
                    }
                });

                await saveToSupabase();
                renderQuestionList();
                renderBgImageList();

                let message = `取り込み完了: 問題${addedCount}件追加、${duplicateCount}件の重複をスキップしました。`;
                if (bgUpdated) {
                    message += `\n背景画像リスト（${bgImages.length}枚）を新しいデータに更新しました。`;
                }
                alert(message);
            } catch (err) {
                alert('JSONファイルの読み込みに失敗しました。');
                console.error(err);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>
