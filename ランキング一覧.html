<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネプリーグ2Cない！？ - ランキング一覧</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: BIZ UDP明朝 & 游明朝 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Shippori+Mincho&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --sub-text-color: #cccccc;
            --accent-neon: #aae1ff;
            --border-color: rgba(170, 225, 255, 0.3);
            
            --font-title: 'BIZ UDPMincho', 'BIZ UDP明朝', serif;
            --font-body: 'Yu Mincho', '游明朝', 'Shippori Mincho', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
        }

        /* 画面左下の表示 */
        .bottom-left-display {
            position: fixed;
            bottom: 12px;
            left: 15px;
            color: var(--accent-neon);
            font-size: 0.85rem;
            font-family: var(--font-body);
            letter-spacing: 1px;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.8;
        }

        /* 画面中央のメインファーストビュー */
        .hero-section {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: var(--bg-color);
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: clamp(2.5rem, 8vw, 6rem);
            color: #ffffff;
            letter-spacing: 4px;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* コンテナ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* 検索セクション */
        .search-section {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px 20px;
            margin-bottom: 80px;
        }

        .search-title {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--accent-neon);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-group label {
            font-size: 0.9rem;
            color: var(--sub-text-color);
        }

        .search-group input, .search-group select {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 10px;
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color-scheme: dark; /* カレンダーのピッカーや内部アイコン・文字を白ベースにする設定 */
        }

        .search-group input[type="datetime-local"] {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* WebKitブラウザ向けカレンダーアイコンの背景色・反転調整 */
        .search-group input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .search-group input:focus, .search-group select:focus {
            outline: none;
            border-color: var(--accent-neon);
        }

        .search-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-search, .btn-reset {
            background: #000;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 10px 30px;
            font-family: var(--font-body);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .btn-search:hover, .btn-reset:hover {
            background: var(--accent-neon);
            color: #000;
        }

        /* ゲーム別ランキングブロック */
        .game-block {
            margin-bottom: 90px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 50px;
        }

        .game-title {
            font-family: var(--font-title);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent-neon);
            display: inline-block;
            padding-bottom: 8px;
        }

        .game-title-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }

        /* スマホ向けタブ切替ボタン */
        .mobile-tabs {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #000;
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            padding: 8px 16px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: var(--accent-neon);
            color: #000;
            font-weight: bold;
        }

        /* ランキンググリッド (PCで左右2列) */
        .ranking-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .ranking-column-title {
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: var(--accent-neon);
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px rgba(170, 225, 255, 0.2) dashed;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table th, .ranking-table td {
            padding: 10px 8px;
            text-align: center;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ranking-table th {
            color: var(--sub-text-color);
            font-weight: normal;
        }

        .rank-1 { color: #facc15; font-weight: bold; }
        .rank-2 { color: #e2e8f0; font-weight: bold; }
        .rank-3 { color: #cbd5e1; font-weight: bold; }

        /* view more ボタン */
        .view-more-container {
            text-align: center;
            margin-top: 15px;
        }

        .view-more-btn {
            background: none;
            border: none;
            color: var(--accent-neon);
            font-family: var(--font-body);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.3s ease;
        }

        .view-more-btn:hover {
            color: #ffffff;
        }

        /* 画面下部 戻るボタン */
        .back-container {
            text-align: center;
            margin-top: 60px;
        }

        .btn-back {
            display: inline-block;
            background: #000;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            text-decoration: none;
            padding: 12px 40px;
            font-family: var(--font-body);
            font-size: 1.1rem;
            letter-spacing: 2px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--accent-neon);
            color: #000;
        }

        /* スマホ用レイアウト調整 (768px未満) */
        @media (max-width: 767px) {
            .hero-title {
                font-size: 3rem;
            }

            .mobile-tabs {
                display: flex;
            }

            .ranking-grid {
                grid-template-columns: 1fr;
            }

            .ranking-column {
                display: none;
            }

            .ranking-column.active {
                display: block;
            }

            .bottom-left-display {
                font-size: 0.75rem;
                bottom: 8px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- 画面左下の水色表示 -->
    <div class="bottom-left-display">UM:38</div>

    <!-- 1. メイン表示 (中央タイトル) -->
    <section class="hero-section">
        <h1 class="hero-title">ランキング</h1>
    </section>

    <div class="container">

        <!-- 2. 検索機能セクション -->
        <section class="search-section">
            <h2 class="search-title">詳細絞り込み検索</h2>
            <div class="search-grid">
                <div class="search-group">
                    <label>開始日時</label>
                    <input type="datetime-local" id="searchFrom">
                </div>
                <div class="search-group">
                    <label>終了日時</label>
                    <input type="datetime-local" id="searchTo">
                </div>
                <div class="search-group">
                    <label>指定得点 (pt)</label>
                    <input type="number" id="searchScore" placeholder="例: 100">
                </div>
                <div class="search-group">
                    <label>対象モード</label>
                    <select id="searchMode">
                        <option value="all">すべてのモード</option>
                        <option value="league">ファイブリーグ</option>
                        <option value="torokko">トロッコアドベンチャー</option>
                        <option value="balloon">パーセントバルーン</option>
                        <option value="bomber">ファイブボンバー</option>
                        <option value="factory">ロゴファクトリー</option>
                    </select>
                </div>
            </div>
            <div class="search-buttons">
                <button class="btn-search" onclick="executeSearch()">検索</button>
                <button class="btn-reset" onclick="resetSearch()">リセット</button>
            </div>
        </section>

        <!-- 3. 各ゲームランキング表示エリア (指定の順序) -->
        <div id="rankingsContainer">
            <!-- JavaScriptで各ゲームのランキングがレンダリングされます -->
        </div>

        <!-- 4. ページ下部 戻るボタン -->
        <div class="back-container">
            <a href="HP.html" class="btn-back">ホームページへ戻る</a>
        </div>

    </div>

    <script>
        // Supabase 設定
        const SUPABASE_URL = 'https://wfddewnonkwxwlaihamn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_RFILYcq2R5yx72AMhsh0JQ_Bfk1eZHA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ゲームの表示順序設定（ご指定の順番）
        const GAMES_CONFIG = [
            { key: 'league',   name: 'ファイブリーグ',         table: 'daily_records_league',   scoreCol: 'five_league',   timeCol: 'five_league_time' },
            { key: 'torokko',  name: 'トロッコアドベンチャー', table: 'daily_records_torokko',  scoreCol: 'torokko',       timeCol: 'torokko_time' },
            { key: 'balloon',  name: 'パーセントバルーン',     table: 'daily_records_ballon',  scoreCol: 'percent_ballon', timeCol: 'percent_ballon_time' },
            { key: 'bomber',   name: 'ファイブボンバー',       table: 'daily_records_bomber',   scoreCol: 'five_bomber',   timeCol: 'five_bomber_time' },
            { key: 'factory',  name: 'ロゴファクトリー',       table: 'daily_records',          scoreCol: 'logo_factory',  timeCol: 'logo_factory_time' }
        ];

        // 各ゲームの生データ保持
        const rawDataMap = {};
        // 各テーブルの表示上限 (default 50)
        const displayLimitMap = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchAllRankings();
            renderAllRankings();
        });

        // Supabaseより全データ取得
        async function fetchAllRankings() {
            for (const game of GAMES_CONFIG) {
                displayLimitMap[game.key] = 50; // デフォルト50位上限
                try {
                    const { data, error } = await supabaseClient
                        .from(game.table)
                        .select('*')
                        .order(game.scoreCol, { ascending: false })
                        .order(game.timeCol, { ascending: true });

                    if (!error && data) {
                        rawDataMap[game.key] = data;
                    } else {
                        rawDataMap[game.key] = [];
                    }
                } catch (e) {
                    rawDataMap[game.key] = [];
                }
            }
        }

        // 全ランキングの描画
        function renderAllRankings(filterParams = null) {
            const container = document.getElementById('rankingsContainer');
            container.innerHTML = '';

            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            GAMES_CONFIG.forEach(game => {
                // 検索モード指定のチェック
                if (filterParams && filterParams.mode !== 'all' && filterParams.mode !== game.key) {
                    return;
                }

                let list = rawDataMap[game.key] || [];

                // 検索条件によるフィルタリング
                if (filterParams) {
                    list = list.filter(item => {
                        let pass = true;
                        
                        // 時間絞り込み
                        if (item.created_at) {
                            const itemTime = new Date(item.created_at).getTime();
                            if (filterParams.from && itemTime < filterParams.from) pass = false;
                            if (filterParams.to && itemTime > filterParams.to) pass = false;
                        }

                        // 得点絞り込み
                        if (filterParams.score !== null && item[game.scoreCol] !== filterParams.score) {
                            pass = false;
                        }

                        return pass;
                    });
                }

                // 今日のランキング ＆ 総合ランキング 分割
                const todayData = list.filter(item => {
                    if (!item.created_at) return false;
                    const d = new Date(item.created_at);
                    const dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    return dStr === todayStr;
                });

                const overallData = list;

                // ゲームブロックのHTML作成
                const blockHtml = createGameBlockHtml(game, todayData, overallData);
                container.appendChild(blockHtml);
            });

            if (container.innerHTML === '') {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--sub-text-color);">該当するデータが見つかりませんでした。</div>';
            }
        }

        // 個別ゲームブロック要素の作成
        function createGameBlockHtml(game, todayData, overallData) {
            const wrapper = document.createElement('div');
            wrapper.className = 'game-block';
            wrapper.id = `block-${game.key}`;

            const limit = displayLimitMap[game.key] || 50;

            wrapper.innerHTML = `
                <div class="game-title-wrapper">
                    <h2 class="game-title">${game.name}</h2>
                </div>

                <!-- スマホ用切り替えタブ -->
                <div class="mobile-tabs">
                    <button class="tab-btn active" onclick="switchMobileTab('${game.key}', 'today')">今日のランキング</button>
                    <button class="tab-btn" onclick="switchMobileTab('${game.key}', 'overall')">総合ランキング</button>
                </div>

                <div class="ranking-grid">
                    <!-- 今日のランキング -->
                    <div class="ranking-column active" id="col-today-${game.key}">
                        <h3 class="ranking-column-title">今日のランキング</h3>
                        ${renderTableHtml(todayData, game, 5, limit)}
                        ${todayData.length > 5 ? `
                            <div class="view-more-container">
                                <button class="view-more-btn" onclick="toggleViewMore('${game.key}', this)">view more ↓</button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- 総合ランキング -->
                    <div class="ranking-column" id="col-overall-${game.key}">
                        <h3 class="ranking-column-title">総合ランキング</h3>
                        ${renderTableHtml(overallData, game, 5, limit)}
                        ${overallData.length > 5 ? `
                            <div class="view-more-container">
                                <button class="view-more-btn" onclick="toggleViewMore('${game.key}', this)">view more ↓</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            return wrapper;
        }

        // テーブル内部HTML生成
        function renderTableHtml(data, game, initialCount, limit) {
            if (!data || data.length === 0) {
                return '<div style="text-align:center; padding: 20px; color: var(--sub-text-color); font-size: 0.9rem;">記録がありません</div>';
            }

            let html = `
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>スコア</th>
                            <th>タイム</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            const sliced = data.slice(0, limit);

            sliced.forEach((item, idx) => {
                const rank = idx + 1;
                const hiddenClass = rank > initialCount ? 'extra-row' : '';
                const displayStyle = rank > initialCount ? 'display: none;' : '';
                const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

                const score = item[game.scoreCol] !== undefined && item[game.scoreCol] !== null ? `${item[game.scoreCol]} pt` : '-';
                const time = item[game.timeCol] !== undefined && item[game.timeCol] !== null ? `${parseFloat(item[game.timeCol]).toFixed(1)}s` : '-';

                html += `
                    <tr class="${hiddenClass}" style="${displayStyle}">
                        <td class="${rankClass}">${rank}位</td>
                        <td>${score}</td>
                        <td>${time}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            return html;
        }

        // view more ボタンの開閉制御
        function toggleViewMore(gameKey, btn) {
            const block = document.getElementById(`block-${gameKey}`);
            const extraRows = block.querySelectorAll('.extra-row');

            const isExpanded = btn.getAttribute('data-expanded') === 'true';

            if (isExpanded) {
                extraRows.forEach(row => row.style.display = 'none');
                btn.textContent = 'view more ↓';
                btn.setAttribute('data-expanded', 'false');
            } else {
                extraRows.forEach(row => row.style.display = 'table-row');
                btn.textContent = 'close ↑';
                btn.setAttribute('data-expanded', 'true');
            }
        }

        // スマホ用タブ切り替え制御
        function switchMobileTab(gameKey, tabType) {
            const block = document.getElementById(`block-${gameKey}`);
            const tabs = block.querySelectorAll('.tab-btn');
            const todayCol = document.getElementById(`col-today-${gameKey}`);
            const overallCol = document.getElementById(`col-overall-${gameKey}`);

            tabs.forEach(t => t.classList.remove('active'));

            if (tabType === 'today') {
                tabs[0].classList.add('active');
                todayCol.classList.add('active');
                overallCol.classList.remove('active');
            } else {
                tabs[1].classList.add('active');
                overallCol.classList.add('active');
                todayCol.classList.remove('active');
            }
        }

        // 検索処理の実行
        function executeSearch() {
            const fromVal = document.getElementById('searchFrom').value;
            const toVal = document.getElementById('searchTo').value;
            const scoreVal = document.getElementById('searchScore').value;
            const modeVal = document.getElementById('searchMode').value;

            // 1項目でも選択・入力されているか確認
            if (!fromVal && !toVal && !scoreVal && modeVal === 'all') {
                alert('検索条件を1項目以上入力または選択してください。');
                return;
            }

            const filterParams = {
                from: fromVal ? new Date(fromVal).getTime() : null,
                to: toVal ? new Date(toVal).getTime() : null,
                score: scoreVal !== '' ? Number(scoreVal) : null,
                mode: modeVal
            };

            renderAllRankings(filterParams);
        }

        // 検索条件のリセット
        function resetSearch() {
            document.getElementById('searchFrom').value = '';
            document.getElementById('searchTo').value = '';
            document.getElementById('searchScore').value = '';
            document.getElementById('searchMode').value = 'all';

            renderAllRankings();
        }
    </script>
</body>
</html>
